name: MTGB source checks

on:
  push:
    paths:
      - 'Assets/Scripts/**'
      - 'Tools/ForgeBridge/**'
      - 'Tools/Validation/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Assets/Scripts/**'
      - 'Tools/ForgeBridge/**'
      - 'Tools/Validation/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Source guards (not a Unity player build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate patch and evidence tooling
        run: >-
          python -X utf8 -m unittest -v
          Tools/Validation/TestNativePatches.py
          Tools/Validation/TestInteractionContract.py
          Tools/Validation/TestMechanicCoverage.py
          Tools/Validation/TestPresentationCoverage.py
      - name: Check process text encodings
        run: python -X utf8 Tools/Validation/Test-TextEncoding.py

# Full Windows/Linux player builds require the Unity Editor and the pinned
# ForgeRuntime, which is intentionally excluded from Git. These source guards
# do not certify a player build or rerun real-game mechanic coverage.
