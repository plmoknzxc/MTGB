name: Font license guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install fonttools==4.66.1
      - run: python Tools/CardRendering/ValidateCardFonts.py
