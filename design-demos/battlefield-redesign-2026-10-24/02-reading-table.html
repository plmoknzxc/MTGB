.reader{background:radial-gradient(ellipse at 2% 2%,#746c4c18,transparent 55%),linear-gradient(100deg,#292b22,#161c16 94%);border-right-color:#7a6d4d;box-shadow:inset -1px 0 0 #c2ad7526,10px 0 25px #070d075e;z-index:4}.reader-image{box-shadow:0 1px 0 #e0d2a53d,0 7px 9px #020a05b3,0 19px 32px #070d074d}.reader-title{color:#e5dfcc;text-shadow:0 2px 2px #080e0a}.costs{border-bottom-color:#6c684344}.reader-rules{color:#d9decd}.reader-foot{color:#84917c}
.hand-area{background:radial-gradient(ellipse at 50% -35%,#6e73513b,transparent 76%),linear-gradient(180deg,#272c21,#161e17 60%);border-top-color:#a69b6a70;box-shadow:inset 0 2px 0 #d6c69118,inset 0 6px 12px #0a120c88,0 -9px 24px #09120b55;z-index:2}.hand-bar{color:#b1b69f}.hand-bar .hand-status{color:#8d9a86}.hand-bar .hand-count{border-left-color:#6a705643}.hand-card .hand-title{color:#d3d6c0;text-shadow:0 2px 2px #06110a}.hand-card img.card-image{box-shadow:0 1px 0 #dacaa03b,0 4px 2px #06100a,0 13px 12px #0610099c,0 21px 27px #02090559}.hand-card:not(:hover) img.card-image{filter:saturate(.91) brightness(.95)}.hand-card .cost-badge{background:#282f22f5;border-color:#777d5d;color:#e0e3cc;box-shadow:0 2px 3px #050d0870}.hand-card .no-action{background:#737b5e66}
.stack-rail{background:radial-gradient(ellipse at 95% 4%,#72694f1a,transparent 63%),linear-gradient(90deg,#252b21,#171f18 12%,#151d16);border-left-color:#7b704f;box-shadow:inset 1px 0 0 #dac38c20,-9px 0 26px #030b074f;z-index:3}.stack-head{border-bottom-color:#887b4c70}.stack-item{background:linear-gradient(145deg,#353b2e,#252e23 65%);border-color:#6c705651;box-shadow:inset 0 1px 0 #d8d1aa0d,0 4px 7px #06100955}.stack-item:hover{background:linear-gradient(145deg,#404638,#2a3528 72%)}.stack-item.selected{border-color:var(--enemy);box-shadow:inset 0 1px 0 #efb9bb18,0 4px 7px #06100966}.stack-item.own.selected{border-color:var(--own)}.stack-thumb{box-shadow:0 2px 3px #030b08a6}.stack-head h2,.phase-title{color:#e5e0c9}.stack-note{color:#b9c2ad}.stack-empty-note{color:#97a18a}.phase-track span{background:#606d5159}.phase-track span.active{background:#c9c49f}.pass{background:linear-gradient(180deg,#d1caa9,#bcb893);border-color:#ddd1a3;color:#20271b;box-shadow:inset 0 1px 0 #fff7d080,0 3px 6px #0610089c}.pass:hover{background:linear-gradient(180deg,#e0d9b9,#cec8a7);color:#172112}.priority-bottom{color:#99a78c}.priority-bottom button{color:#b4c0a5}
</style>
</head>
<body>
<main id="fit">
 <header class="top"><span class="wordmark">MTGB</span><span class="top-rule"></span><button class="history-button" data-action="history">对局记录</button><span class="top-right"><span class="turn-chip">第 <span id="turn">10</span> 回合 · 你的回合</span><span>•••</span></span></header>
 <aside class="reader" id="reader">
  <button class="reader-toggle" data-action="inspect-open">查看卡牌</button>
  <div class="reader-top"><span>卡牌详情</span><span class="reader-tools"><button id="pin" data-action="inspect-pin">固定</button><button class="close" data-action="inspect-close" aria-label="关闭详情">×</button></span></div>
  <h1 class="reader-title" id="reader-title"></h1><div class="reader-meta"><span class="owner-text" id="reader-owner"></span><span>·</span><span id="reader-type"></span></div>
  <img class="reader-image" id="reader-image" alt=""><div class="costs" id="reader-cost"></div><div class="reader-rules" id="reader-rules"></div>
  <div class="reader-foot"><span id="reader-zone"></span><span id="reader-pin-state">悬停查看 · 点击固定</span></div>
 </aside>
 <section class="board">
  <div class="seat-edge"></div><div class="player-bar enemy"><span class="player-name">对手</span><span class="life" id="enemy-life">20</span><div class="zone-list" id="enemy-zones"></div><div class="opponent-hand" id="enemy-hand"></div></div>
  <div class="enemy-lands" id="enemy-lands"></div><div class="opponent-permanents" id="enemy-units"></div><div class="battle-line"><span>战场</span></div><div class="own-lands" id="own-lands"></div><div class="own-divider"></div>
 </section>
 <section class="hand-area"><div class="hand-bar"><span class="you">你</span><span class="your-life" id="own-life">16</span><span class="hand-count">手牌 <span id="hand-count">5</span></span><span class="hand-status">当前没有可施放的手牌</span></div><div class="hand-row" id="hand-row"></div></section>
 <aside class="stack-rail"><div class="stack-head"><h2>堆叠</h2><span id="stack-count">2 项</span></div><div id="stack-list"></div><p class="stack-empty-note">由上至下结算</p><div class="priority-block"><div class="priority-label" id="priority-label">你可以响应</div><div class="phase-title" id="phase"></div><div class="phase-track"><span></span><span></span><span class="active"></span><span></span><span></span><span></span></div><button class="pass" id="pass" data-action="pass"><span>让过优先权</span><span>→</span></button><div class="priority-bottom"><button class="pause" id="pause" data-action="pause">下阶段暂停</button><button data-action="mode" id="mode">手动</button></div></div></aside>
 <aside class="history-panel" id="history"><div class="history-title">对局记录<button class="close" data-action="history-close" aria-label="关闭记录">×</button></div><div class="history-round">第10回合 · 战斗前主要阶段</div><ol class="history-list" id="history-list"></ol></aside>
 <section class="zone-browser" id="zone-browser"><div class="browser-heading"><div><h2 id="browser-title"></h2><p>点击卡牌查看详情</p></div><button class="close" data-action="zone-close" aria-label="关闭区域">×</button></div><div class="zone-cards" id="zone-cards"></div></section><div class="toast" id="toast"></div>
</main>
<script src="./scene-data.js"></script>
<script>
(()=>{'use strict';const D=window.MTGB_DATA,C=D.cards,root=document.getElementById('fit');let pinned=false,current=D.initialInspect,selected=D.stack[0].id,dense=false,toastTimer;
const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mana(text){return String(text||'').replace(/\{([^}]+)\}/g,(_,s)=>D.assets.mana[s]?`<img src="${D.assets.mana[s]}" alt="${escape(s)}">`:s==='T'?'<span class="generic">↷</span>':s==='E'?'<span class="energy">◇</span>':`<span class="generic">${escape(s)}</span>`)}
function rules(text){return escape(text).replace(/\{([^}]+)\}/g,(_,s)=>`<span class="mana">${mana('{'+s+'}')}</span>`)}
function fit(){const scale=Math.min(innerWidth/1600,innerHeight/900);root.style.transform=`scale(${scale})`;root.style.left=((innerWidth-1600*scale)/2)+'px';root.style.top=((innerHeight-900*scale)/2)+'px'}addEventListener('resize',fit);fit();
function inspect(id,force=false){if(pinned&&!force)return;const c=C[id];if(!c)return;current=id;$('reader').classList.remove('closed');$('reader-title').textContent=c.name;$('reader-image').src=c.image;$('reader-image').alt=c.name;$('reader-type').textContent=c.type;$('reader-owner').textContent=c.owner===1?'你的牌':'对手的牌';$('reader-owner').classList.toggle('own',c.owner===1);$('reader-rules').innerHTML=rules(c.rules);const noCost=c.cost==='no cost'||!c.cost;const different=c.cost!==c.printedCost;$('reader-cost').innerHTML=noCost?'<span>法术力费用</span><span>—</span>':`<span>${different?'当前费用':'法术力费用'}</span><span class="mana">${mana(c.cost)}</span>`+(different?`<span>印刷费用</span><span class="mana">${mana(c.printedCost)}</span>`:'');$('reader-zone').textContent=({Hand:'手牌',Battlefield:'战场',Stack:'堆叠',Graveyard:'坟墓场',Exile:'放逐区'}[c.zone]||c.zone);}
function pin(id){pinned=false;inspect(id,true);pinned=true;setPin()}function setPin(){$('pin').classList.toggle('active',pinned);$('pin').textContent=pinned?'取消固定':'固定';$('reader-pin-state').textContent=pinned?'已固定':'悬停查看 · 点击固定';$('reader-pin-state').classList.toggle('pinned',pinned)}
function cardListeners(el,id){el.addEventListener('mouseenter',()=>inspect(id));el.addEventListener('focus',()=>inspect(id));el.addEventListener('click',()=>pin(id));}
function permanent(id,kind){const c=C[id],e=document.createElement('button');e.className='permanent '+kind+(c.tapped?' tapped':'');e.dataset.zone='battlefield';e.dataset.cardId=id;e.setAttribute('aria-label',c.name+(c.tapped?'，已横置':''));e.innerHTML=`<img class="face" src="${c.image}" alt="${escape(c.name)}">`+(kind==='land'?`<span class="land-name">${escape(c.name)}</span>`:`<span class="unit-name">${escape(c.name)}</span>`)+(c.creature?`<span class="pt">${c.power}/${c.toughness}</span>`:'');cardListeners(e,id);return e}
function zoneBar(p){return `<span>牌库 <strong>${p.library}</strong></span><button data-action="graveyard" data-seat="${p.seat}">坟墓场 <strong>${p.graveyard.length}</strong></button><button data-action="exile" data-seat="${p.seat}">放逐 <strong>${p.exile.length}</strong></button>`}
function populate(){const own=D.players[0],opp=D.players[1];$('enemy-life').textContent=opp.life;$('own-life').textContent=own.life;$('turn').textContent=D.turn;$('phase').textContent=D.phase;$('enemy-zones').innerHTML=zoneBar(opp);$('hand-count').textContent=dense?own.hand.length+4:own.hand.length;$('enemy-hand').innerHTML=Array.from({length:opp.handCount},()=>`<img src="${D.assets.back}" alt="隐藏手牌">`).join('')+`<span>手牌 ${opp.handCount}</span>`;
 $('enemy-lands').replaceChildren(...opp.battlefield.filter(i=>C[i].land).map(i=>permanent(i,'land')));$('own-lands').replaceChildren(...own.battlefield.filter(i=>C[i].land).map(i=>permanent(i,'land')));
 const units=opp.battlefield.filter(i=>!C[i].land);$('enemy-units').replaceChildren(...(dense?units.concat(units.slice(0,3)):units).map(i=>permanent(i,C[i].creature?'creature':'support')));
 $('hand-row').replaceChildren(...(dense?own.hand.concat(own.hand.slice(0,4)):own.hand).map(id=>{const c=C[id],e=document.createElement('button');e.className='hand-card';e.dataset.zone='hand';e.dataset.cardId=id;e.setAttribute('aria-label',c.name+'，查看');e.innerHTML=`<span class="hand-title">${escape(c.name)}</span><img class="card-image" src="${c.image}" alt="${escape(c.name)}"><span class="cost-badge">${c.cost!==c.printedCost?'<small>现</small>':''}<span class="mana">${mana(c.cost)}</span></span><span class="no-action"></span>`;cardListeners(e,id);return e}));
 $('history-list').innerHTML=D.history.map((x,i)=>`<li><span class="history-time">${i===0?'你':'对手'}</span>${escape(x.replace(/^(?:你|对手)/,''))}</li>`).join('');renderStack();}
function renderStack(){const selectedItem=D.stack.find(x=>x.id===selected),targets=new Set(selectedItem?.targets||[]);$('stack-list').innerHTML='';D.stack.forEach((s,i)=>{if(i){const line=document.createElement('div');line.className='stack-divider';$('stack-list').append(line)}const c=C[s.cardId],b=document.createElement('button');b.className='stack-item '+(s.owner===1?'own':'enemy')+(s.id===selected?' selected':'')+(targets.has(s.id)?' targeted':'');b.dataset.action='stack';b.dataset.stackId=s.id;b.dataset.cardId=s.cardId;b.setAttribute('aria-label',(s.owner===1?'你':'对手')+'的'+s.name);b.innerHTML=`<div class="stack-top"><img class="stack-thumb" src="${c.image}" alt=""><div class="stack-text"><div class="stack-owner"><span>${s.owner===1?'你':'对手'} · ${s.kind}</span><span>${i===0?'先结算':''}</span></div><div class="stack-name">${escape(s.name)}</div><div class="stack-cost"><span class="mana">${mana(c.cost)}</span></div></div></div><div class="stack-note">${escape(s.note)}</div>`+(s.targets.length?`<div class="target-line">目标：${escape(C[D.stack.find(x=>x.id===s.targets[0]).cardId].name)}</div>`:'')+`<div class="target-badge">被对手的${escape(D.stack[0].name)}指定为目标</div>`;b.addEventListener('mouseenter',()=>inspect(s.cardId));b.addEventListener('focus',()=>inspect(s.cardId));b.addEventListener('click',()=>{selected=s.id;pinned=false;inspect(s.cardId,true);setPin();renderStack()});$('stack-list').append(b)});}
function openZone(seat,kind){const p=D.players.find(p=>p.seat===Number(seat)),cards=p[kind];$('browser-title').textContent=(p.seat===1?'你的':'对手的')+(kind==='graveyard'?'坟墓场':'放逐区')+' · '+cards.length+'张';$('zone-cards').replaceChildren(...cards.map(id=>{const c=C[id],b=document.createElement('button');b.className='zone-card';b.dataset.cardId=id;b.innerHTML=`<img src="${c.image}" alt="${escape(c.name)}"><span>${escape(c.name)}</span>`;cardListeners(b,id);return b}));$('zone-browser').classList.add('open');}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1600)}
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(!action)return;switch(action.dataset.action){case'history':$('history').classList.toggle('open');break;case'history-close':$('history').classList.remove('open');break;case'inspect-close':pinned=false;setPin();$('reader').classList.add('closed');break;case'inspect-open':$('reader').classList.remove('closed');break;case'inspect-pin':pinned=!pinned;setPin();break;case'graveyard':openZone(action.dataset.seat,'graveyard');break;case'exile':openZone(action.dataset.seat,'exile');break;case'zone-close':$('zone-browser').classList.remove('open');break;case'pass':$('pass').disabled=true;$('pass').firstElementChild.textContent='等待对手';$('priority-label').textContent='对手响应中';toast('已让过优先权');break;case'pause':action.classList.toggle('active');break;case'mode':action.textContent=action.textContent==='手动'?'自动':'手动';break;}});
addEventListener('keydown',e=>{if(e.key==='Escape'){$('history').classList.remove('open');$('zone-browser').classList.remove('open');pinned=false;setPin();}});
window.setDense=value=>{dense=Boolean(value);root.classList.toggle('dense',dense);populate()};populate();inspect(current,true);
// Own public zones sit with the hand, rather than being mixed into the card ribbon.
const ownZones=document.createElement('div');ownZones.className='zone-list';ownZones.style.cssText='position:absolute;left:30px;top:474px;width:110px;gap:0;flex-direction:column';ownZones.innerHTML=zoneBar(D.players[0]);document.querySelector('.board').append(ownZones);
})();
</script>
</body>
</html>
