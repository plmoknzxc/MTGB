<!--
  沉浸牌桌：真实录像场面，不执行规则。
  假设：横排手牌作为一条牌廊；阅读卡牌与规则放在同一条下方阅读台，
  不再向战场里堆弹窗。对手在上、你在下，右侧保留反击链和优先权。
  这里刻意保留己方没有生物时的留白，不用虚构永久物填满画面。
  用户校正：视频只参考横排手牌。中央独立设计为有厚度的石质竞技场，
  原有景观只在边缘显露；所有景观、地面与边缘层均不参与指针命中。
-->

<div class="head"><div class="wordmark">MTGB<small>牌桌</small></div><div class="round"><span>第 <b id="turn">10</b> 回合</span><strong id="phase">战斗前主要阶段</strong></div></div>
<div class="rail-rule"></div>
<section class="player opponent" aria-label="对手资料"><div class="identity"><span class="monogram">对</span><span class="player-name">对手</span></div><div class="life" id="their-life">20</div><div class="zones" id="their-zones"></div></section>
<section class="player you" aria-label="你的资料"><div class="identity"><span class="monogram">你</span><span class="player-name">你</span></div><div class="life" id="our-life">16</div><div class="zones" id="our-zones"></div></section>
<div class="private-hand" id="private-hand" aria-label="对手的隐藏手牌"></div>
<section class="enemy-land-section"><div class="zone-title">对手的地</div><div class="land-line" id="enemy-lands"></div><button class="land-pager" aria-label="浏览更多对手地牌" data-scroll="enemy-lands">›</button></section>
<section class="enemy-section"><div class="zone-title">对手的战场</div><div class="creature-line" id="enemy-permanents"></div><button class="creature-pager" aria-label="浏览更多永久物" data-scroll="enemy-permanents">›</button></section>
<div class="center-seam"></div>
<section class="own-section"><div class="zone-title">你的地</div><div class="land-line" id="own-lands"></div><button class="land-pager" aria-label="浏览更多你的地牌" data-scroll="own-lands">›</button></section>
<aside class="stack-area" aria-label="堆叠"><div class="stack-heading">堆叠<span>从上到下结算</span></div><div id="stack-list"></div></aside>
<section class="priority"><span class="priority-message" id="priority-message">轮到你响应</span><button class="pass-button" data-action="pass" id="pass-button">让过优先权<span>→</span></button><div class="mode-row"><span>第10回合 · 你的回合</span><button data-action="auto" aria-pressed="false">手动</button></div></section>
<section class="dock" aria-label="手牌与阅读台"><div class="hand-region"><div class="hand-heading">手牌 <b id="hand-count">5</b><span class="hint">当前无可施放的牌</span></div><div class="hand-line" id="hand"></div></div>
<span class="reader-empty" id="reader-empty" hidden>移到牌上查看</span><aside class="reader" id="reader" aria-label="卡牌详情"><button class="reader-photo" data-action="zoom" aria-label="查看完整牌面"><img id="reader-image" alt=""></button><div class="reading"><div class="reader-toolbar"><button data-action="pin" aria-pressed="false">固定</button><button data-action="inspect-close" class="close" aria-label="关闭卡牌详情">×</button></div><h2 class="reader-title" id="reader-title"></h2><div class="reader-meta"><span id="reader-type"></span><span id="reader-cost" class="mana"></span></div><div class="reader-rules" id="reader-rules"></div><div class="reader-cost-change" id="reader-cost-change"></div></div></aside>
</section>
<aside class="drawer history-drawer" id="history" hidden aria-label="对局记录"><div class="drawer-header"><h2>对局记录</h2><button data-action="history-close" class="drawer-close" aria-label="关闭对局记录">×</button></div><ol class="history-list" id="history-list"></ol></aside>
<aside class="drawer" id="browser" hidden aria-label="公开区域浏览"><div class="drawer-header"><h2 id="browser-title"></h2><button data-action="browser-close" class="drawer-close" aria-label="关闭区域浏览">×</button></div><div id="browser-list" class="drawer-list"></div></aside>
<div class="zoom" id="zoom" hidden role="dialog" aria-modal="true" aria-label="完整牌面"><button class="zoom-close" data-action="zoom-close" aria-label="关闭完整牌面">×</button><img id="zoom-image" alt=""><div class="zoom-copy"><small id="zoom-type"></small><h2 id="zoom-name"></h2><p id="zoom-rules"></p></div></div>
</main></div><script src="scene-data.js"></script><script>
(()=>{
'use strict';const D=window.MTGB_DATA,$=s=>document.querySelector(s),cards=D.cards;const own=D.players.find(p=>p.seat===1),other=D.players.find(p=>p.seat===2);
let activeCard=D.initialInspect,pinned=false,selectedStack=D.stack[0].id,dense=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mana(cost){if(!cost||cost==='no cost')return'';return[...cost.matchAll(/\{([^}]+)\}/g)].map(([,s])=>D.assets.mana[s]?`<img src="${D.assets.mana[s]}" alt="${esc(s)}">`:`<span class="generic">${esc(s)}</span>`).join('');}
function rules(text){return esc(text).replace(/\{([^}]+)\}/g,(_,s)=>({W:'白',U:'蓝',B:'黑',R:'红',G:'绿',T:'横置',E:'能量'}[s]||s));}
function fit(){const scale=Math.min(innerWidth/1600,innerHeight/900);$('#fit').style.transform=`translate(-50%,-50%) scale(${scale})`;}
addEventListener('resize',fit);fit();$('#table').style.setProperty('--mat',`url("${'assets/battlefield-source.png'}")`);
$('#turn').textContent=D.turn;$('#phase').textContent=D.phase;$('#our-life').textContent=own.life;$('#their-life').textContent=other.life;$('#hand-count').textContent=own.hand.length;
$('#private-hand').innerHTML=Array.from({length:other.handCount},()=>`<img src="${D.assets.back}" alt="对手的隐藏手牌">`).join('')+`<span>${other.handCount} 张</span>`;
function zones(p,target){$(target).innerHTML=`<button class="zone-link" disabled aria-label="${p.name}的牌库${p.library}张"><span>牌库</span><b>${p.library}</b></button><button class="zone-link" data-action="graveyard" data-seat="${p.seat}" aria-label="查看${p.name}的坟墓场"><span>坟墓场</span><b>${p.graveyard.length}</b></button><button class="zone-link" data-action="exile" data-seat="${p.seat}" aria-label="查看${p.name}的放逐区"><span>放逐</span><b>${p.exile.length}</b></button>`;}
zones(own,'#our-zones');zones(other,'#their-zones');
function land(id){const c=cards[id];return`<button class="land-card ${c.tapped?'tapped':''}" data-card-id="${id}" data-zone="battlefield" aria-label="${esc(c.name)}${c.tapped?'，已横置':''}"><span class="land-art"><img src="${c.image}" alt="${esc(c.name)}"></span><span class="land-name">${esc(c.name)}</span></button>`;}
function permanent(id){const c=cards[id];return`<button class="permanent" data-card-id="${id}" data-zone="battlefield" aria-label="${esc(c.name)}${c.creature?'，'+c.power+'/'+c.toughness:''}"><img src="${c.image}" alt="${esc(c.name)}">${c.creature?`<span class="power">${c.power}/${c.toughness}</span>`:''}<span class="permanent-name">${esc(c.name)}</span></button>`;}
function renderBoard(){const enemyLands=other.battlefield.filter(id=>cards[id].land),ourLands=own.battlefield.filter(id=>cards[id].land),creatures=other.battlefield.filter(id=>cards[id].creature),supports=other.battlefield.filter(id=>!cards[id].creature&&!cards[id].land);$('#enemy-lands').innerHTML=(dense?[...enemyLands,...enemyLands,...enemyLands]:enemyLands).map(land).join('');$('#own-lands').innerHTML=(dense?[...ourLands,...ourLands,...ourLands]:ourLands).map(land).join('');$('#enemy-permanents').innerHTML=(dense?[...creatures,...creatures,...creatures]:creatures).map(permanent).join('')+`<div class="support">${supports.map(permanent).join('')}</div>`;$('#table').classList.toggle('dense',dense);}
renderBoard();
$('#hand').innerHTML=own.hand.map(id=>{const c=cards[id];return`<button class="hand-card" data-card-id="${id}" data-zone="hand" aria-label="查看手牌${esc(c.name)}"><img src="${c.image}" alt="${esc(c.name)}"><span class="hand-cost mana">${mana(c.cost)}</span></button>`;}).join('');
function showCard(id,force=false){if(!cards[id]||(pinned&&!force))return;activeCard=id;const c=cards[id];$('#reader').hidden=false;$('#reader-empty').hidden=true;$('#reader-image').src=c.image;$('#reader-image').alt=c.name;$('#reader-title').textContent=c.name;$('#reader-type').textContent=c.type;$('#reader-cost').innerHTML=mana(c.cost);$('#reader-rules').innerHTML=rules(c.rules);const diff=c.cost!==c.printedCost&&c.printedCost!=='no cost';$('#reader-cost-change').style.display=diff?'flex':'none';$('#reader-cost-change').innerHTML=diff?'印刷费用 <span class="mana">'+mana(c.printedCost)+'</span>':'';document.querySelectorAll('.hand-card').forEach(el=>el.classList.toggle('picked',el.dataset.cardId===id));}
function renderStack(){const selected=D.stack.find(s=>s.id===selectedStack);$('#stack-list').innerHTML=D.stack.map((s,i)=>{const c=cards[s.cardId],targeted=selected?.targets.includes(s.id);return`<button class="stack-item ${s.owner===1?'self':''} ${s.id===selectedStack?'selected':''} ${targeted?'targeted':''}" data-action="stack" data-stack-id="${s.id}" data-card-id="${s.cardId}" aria-label="${s.owner===1?'你的':'对手的'}${esc(s.name)}${i===0?'，先结算':''}"><img class="stack-thumb" src="${c.image}" alt=""><span class="stack-copy"><span class="stack-owner">${s.owner===1?'你':'对手'} · ${i===0?'先结算':'后结算'}</span><span class="stack-name">${esc(s.name)}</span><span class="stack-note">${esc(s.note)}</span>${s.targets.length?`<span class="target-note"><span class="stack-arrow">↳</span>指向 ${esc(cards[D.stack.find(x=>x.id===s.targets[0]).cardId].name)}</span>`:''}${targeted?'<span class="target-note">对手咒语的目标</span>':''}</span></button>`;}).join('');}
renderStack();showCard(activeCard);
function togglePin(){pinned=!pinned;const p=$('[data-action=pin]');p.classList.toggle('pinned',pinned);p.textContent=pinned?'已固定':'固定';p.setAttribute('aria-pressed',String(pinned));}
function browse(seat,zone){const p=D.players.find(p=>p.seat===Number(seat)),list=p[zone];$('#history').hidden=true;$('#browser').hidden=false;$('#browser-title').textContent=`${p.seat===1?'你的':'对手的'}${zone==='graveyard'?'坟墓场':'放逐区'} · ${list.length}`;$('#browser-list').className=list.length?'drawer-list':'empty-zone';$('#browser-list').innerHTML=list.length?list.map(id=>`<button class="browse-card" data-card-id="${id}" aria-label="查看${esc(cards[id].name)}"><img src="${cards[id].image}" alt="${esc(cards[id].name)}"><span>${esc(cards[id].name)}</span></button>`).join(''):'当前没有牌';}
$('#history-list').innerHTML=[...D.history].reverse().map((text,i)=>`<li class="${text.startsWith('你')?'mine':'enemy'}"><small>${i===0?'刚刚':'第10回合'}</small>${esc(text)}</li>`).join('');
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-card-id]');if(el)showCard(el.dataset.cardId);});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-card-id]');if(el)showCard(el.dataset.cardId);});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const action=el.dataset.action;
if(action==='history'){$('#history').hidden=!$('#history').hidden;$('#browser').hidden=true;}
else if(action==='menu'){$('#menu').hidden=!$('#menu').hidden;el.setAttribute('aria-expanded',String(!$('#menu').hidden));}
else if(action==='view-battlefield'){$('#menu').hidden=true;$('#history').hidden=true;$('#browser').hidden=true;$('#reader').hidden=true;$('#reader-empty').hidden=false;}
else if(action==='reset-view'){$('#menu').hidden=true;$('#history').hidden=true;$('#browser').hidden=true;$('#zoom').hidden=true;if(pinned)togglePin();selectedStack=D.stack[0].id;renderStack();showCard(D.initialInspect,true);}
else if(action==='history-close')$('#history').hidden=true;
else if(action==='browser-close')$('#browser').hidden=true;
else if(action==='graveyard'||action==='exile')browse(el.dataset.seat,action);
else if(action==='stack'){selectedStack=el.dataset.stackId;renderStack();showCard(el.dataset.cardId,true);}
else if(action==='pin')togglePin();
else if(action==='inspect-close'){$('#reader').hidden=true;$('#reader-empty').hidden=false;if(pinned)togglePin();}
else if(action==='zoom'){const c=cards[activeCard];$('#zoom-image').src=c.image;$('#zoom-image').alt=c.name;$('#zoom-name').textContent=c.name;$('#zoom-type').textContent=c.type;$('#zoom-rules').innerHTML=rules(c.rules);$('#zoom').hidden=false;}
else if(action==='zoom-close')$('#zoom').hidden=true;
else if(action==='pass'){$('#priority-message').textContent=$('#priority-message').textContent==='轮到你响应'?'对手响应中':'轮到你响应';$('#pass-button').childNodes[0].textContent=$('#priority-message').textContent==='轮到你响应'?'让过优先权':'等待对手';}
else if(action==='auto'){const on=el.getAttribute('aria-pressed')==='true';el.setAttribute('aria-pressed',String(!on));el.textContent=on?'手动':'自动';}
else if(el.dataset.scroll)document.getElementById(el.dataset.scroll).scrollBy({left:400,behavior:'smooth'});
else if(el.dataset.cardId){showCard(el.dataset.cardId,true);if(!pinned)togglePin();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#zoom').hidden)$('#zoom').hidden=true;else if(!$('#menu').hidden)$('#menu').hidden=true;else if(!$('#browser').hidden)$('#browser').hidden=true;else if(!$('#history').hidden)$('#history').hidden=true;else if(pinned)togglePin();}});
window.setDense=value=>{dense=!!value;renderBoard();};
})();
</script></body></html>
