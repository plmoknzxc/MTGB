<!--
  方向：清醒竞技场。卡图是唯一高饱和内容；身份、阅读、操作有稳定位置。
  横排完整手牌与战场严格分区。右侧堆叠→详情→优先权是一条阅读路线。
  本页使用共用录像内容，只表现界面交互，不执行游戏规则。
  2026-10-24 战场修订：视频只影响横排手牌；战场独立设计为切边曜石台面。
  现有背景仅放大裁取中央石纹，压低对比，不沿用其柱廊构图。
  装饰层没有指针事件；卡牌和交互区域坐标不变，加入实体接触阴影与落场过渡。
-->

.hand-card:hover .hand-image,.hand-card.pinned .hand-image{box-shadow:0 -1px 0 #dce2db55,1px 3px 0 #03070b,7px 16px 16px #000b,13px 25px 27px #0006}
.hand-card .h-name{text-shadow:0 2px 3px #000b;color:#cbd3dd}.hand-card .cost{background:linear-gradient(140deg,#35404d,#151e2a);box-shadow:0 0 0 1px #84919c4d,1px 3px 5px #0008}
.reading-rail{background:linear-gradient(100deg,#0a0f16ed,#151a22f2 40%,#0a0e14f5);border-left-color:#a4b0ba2e;box-shadow:-9px 0 24px #0005,inset 1px 0 0 #000b;padding-right:0}
.rail-heading{text-shadow:0 2px 3px #000}.stack-entry{background:linear-gradient(125deg,#202933b8,#111820ce);border-color:#8c9da42d;box-shadow:0 2px 4px #0005,inset 0 1px 0 #d3d9d80a}.stack-entry.selected{background:linear-gradient(125deg,#302630,#171a24);box-shadow:0 2px 5px #0008,inset 0 1px 0 #edb9c313}.stack-entry.selected.self{background:linear-gradient(125deg,#26364c,#141c29)}
.stack-entry img{box-shadow:1px 2px 3px #000b;border:1px solid #aeb7bb3b}.inspector{border-top-color:#82929c3b}.inspect-image{box-shadow:0 -1px 0 #efeee42e,1px 3px 0 #04080c,5px 10px 18px #000c;border:1px solid #d0d2ca46}.rules{color:#cdd4dc}
.priority .pass{background:linear-gradient(180deg,#45658b,#2a4364);border-color:#8ca3bc96;box-shadow:inset 0 1px 0 #dceafa26,0 3px 0 #101c2d,0 7px 13px #0007;text-shadow:0 1px 2px #06101f}.priority .pass:hover{background:linear-gradient(180deg,#4d719a,#314e72)}
@keyframes card-settle{from{transform:translateY(-7px);opacity:.82}to{transform:translateY(0);opacity:1}}
@media(prefers-reduced-motion:reduce){.permanent img{animation:none}.permanent,.hand-card{transition:none}}
</style>
</head>
<body>
<main id="arena" aria-label="MTGB对局战场">
  <div class="arena-atmosphere" aria-hidden="true"><div class="slab-shadow"></div><div class="stone-table"><div class="stone-grain"></div><div class="stone-light"></div><div class="table-rim"></div><div class="front-facet"></div></div><div class="front-recess"></div></div>
  <header class="top"><span class="wordmark">MTGB</span><span class="round">第 10 回合</span><div class="turn">你的回合 <span class="phase">战斗前主要阶段</span></div><div class="top-tools"><button id="view-board">查看战场</button><button id="settings">设置</button></div></header>
  <aside class="left" aria-label="牌手与公开区域">
    <section class="identity foe"><div class="who">对手</div><div class="life">20</div><div class="zone-counts"><button data-action="library" data-seat="2"><span>牌库</span><b>45</b></button><button data-action="graveyard" data-seat="2"><span>坟墓场</span><b>4</b></button><button data-action="exile" data-seat="2"><span>放逐区</span><b>1</b></button></div></section>
    <button class="history-button" data-action="history" aria-expanded="false">对局记录</button>
    <section class="history-panel" id="history-panel"><header><span>最近发生</span><button data-action="history-close" aria-label="收起对局记录">×</button></header><ol id="history-list"></ol></section>
    <section class="identity self"><div class="who">你</div><div class="life">16</div><div class="zone-counts"><button data-action="library" data-seat="1"><span>牌库</span><b>39</b></button><button data-action="graveyard" data-seat="1"><span>坟墓场</span><b>5</b></button><button data-action="exile" data-seat="1"><span>放逐区</span><b>5</b></button></div><div class="under"></div><div style="font-size:12px;color:#68768a">可用法术力　0</div></section>
    <div class="small-status">联机对局</div>
  </aside>
  <section class="field" aria-label="战场永久物"><div class="hidden-hand" id="hidden-hand"></div><div class="land-row opponent" id="opponent-lands"></div><div class="units" id="opponent-units"></div><div class="center-line"></div><div class="own-space">你的战场</div><div class="land-row own" id="own-lands"></div></section>
  <section class="hand-dock" aria-label="你的横排手牌"><div class="hand-heading"><b>手牌</b><span class="number">5</span><span class="hint">你的优先权</span></div><div class="hand-row" id="hand-row"></div></section>
  <aside class="reading-rail" aria-label="堆叠与卡牌详情"><div class="rail-heading">堆叠 <span>2</span></div><div class="stack-list" id="stack-list"></div><div class="stack-order">从上到下依次结算</div>
    <section class="inspector" id="inspector" aria-label="卡牌详情"><div class="inspector-content"><div class="inspect-header"><h2 id="inspect-name"></h2><div class="inspect-tools"><button class="pin" data-action="inspect-pin">固定</button><button data-action="inspect-close" aria-label="关闭详情">×</button></div></div><img class="inspect-image" id="inspect-image" alt=""><div class="type-cost"><span id="inspect-type"></span><span class="symbols" id="inspect-cost"></span></div><div class="printed-cost" id="printed-cost"></div><div class="rules" id="inspect-rules"></div><div class="detail-foot"><span id="inspect-owner"></span><span id="inspect-printing"></span></div></div><div class="inspect-empty">悬停卡牌查看</div></section>
  </aside>
  <section class="priority"><div class="above"><span id="priority-text">你的优先权</span><button class="mode" data-action="mode">手动 ⌄</button></div><button class="pass" data-action="pass">让过优先权</button><div class="mode-menu" id="mode-menu"><button>手动</button><button>自动</button><button>略过</button></div></section>
  <div class="browse-backdrop" id="browse-backdrop"><section class="browse-panel" aria-label="公开区域牌张"><header><h2 id="browse-title"></h2><button data-action="browse-close">返回战场</button></header><div id="browse-grid" class="browse-grid"></div></section></div>
  <div class="toast" id="toast" role="status"></div>
</main>
<script src="./scene-data.js"></script>
<script>
(()=>{
'use strict';
const D=window.MTGB_DATA,C=D.cards,arena=document.getElementById('arena');
arena.style.setProperty('--stone-image','url("'+'assets/battlefield-source.png'+'")');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pinned=false,current=D.initialInspect,selectedStack=D.stack[0].id,dense=false,toastTimer;
function mana(value){if(!value||value==='no cost')return '';return [...value.matchAll(/\{([^}]+)\}/g)].map(m=>D.assets.mana[m[1]]?'<img alt="'+esc(m[1])+'" src="'+D.assets.mana[m[1]]+'">':'<span class="mana-generic">'+esc(m[1])+'</span>').join('');}
function fit(){const scale=Math.min(innerWidth/1600,innerHeight/900);arena.style.transform='translate('+((innerWidth-1600*scale)/2)+'px,'+((innerHeight-900*scale)/2)+'px) scale('+scale+')';}addEventListener('resize',fit);fit();
function showInspect(id,force=false){
 if(pinned&&!force)return;
 const c=C[id];if(!c)return;
 current=id;
 const different=c.cost!==c.printedCost;
 $('inspector').classList.remove('hidden');
 $('inspector').classList.toggle('has-cost-change',different);
 $('inspect-name').textContent=c.name;
 $('inspect-image').src=c.image;$('inspect-image').alt=c.name;
 $('inspect-type').textContent=(c.owner===1?'你 · ':'对手 · ')+c.type;
 $('inspect-cost').innerHTML=mana(c.cost);
 $('inspect-rules').innerHTML=esc(c.rules).replace(/\{([WUBRGC])\}/g,(_,v)=>'<img alt="'+v+'" src="'+D.assets.mana[v]+'">');
 $('inspect-owner').textContent=c.owner===1?'你的牌':'对手的牌';
 $('inspect-printing').textContent=c.printing;
 $('printed-cost').style.display=different?'block':'none';
 $('printed-cost').innerHTML=different?'当前费用 '+mana(c.cost)+'　／　印刷费用 '+mana(c.printedCost):'';
 updatePin();
}
function updatePin(){const p=document.querySelector('[data-action="inspect-pin"]');p.textContent=pinned?'取消固定':'固定';p.classList.toggle('active',pinned);document.querySelectorAll('.hand-card').forEach(e=>e.classList.toggle('pinned',pinned&&e.dataset.cardId===current));}
function bindCard(el,id){el.dataset.cardId=id;el.addEventListener('mouseenter',()=>showInspect(id));el.addEventListener('focus',()=>showInspect(id));el.addEventListener('click',()=>{if(el.closest('.browse-grid')){$('browse-backdrop').classList.remove('open');}pinned=true;showInspect(id,true);});}
function land(id,duplicate=0){const c=C[id],b=document.createElement('button');b.className='land'+(c.tapped?' tapped':'');b.dataset.zone='battlefield';b.setAttribute('aria-label',c.name+(c.tapped?'，已横置':''));b.innerHTML='<span class="land-art"><img src="'+c.image+'" alt=""></span><span class="land-label">'+esc(c.name)+'</span>'+(c.tapped?'<span class="tap-mark">横置</span>':'');bindCard(b,id);return b;}
function permanent(id){const c=C[id],b=document.createElement('button');b.className='permanent'+(!c.creature?' support':'');b.dataset.zone='battlefield';b.setAttribute('aria-label',c.name);b.innerHTML='<img src="'+c.image+'" alt="'+esc(c.name)+'">'+(c.power!==null?'<span class="pt">'+c.power+' / '+c.toughness+'</span>':'')+'<span class="p-name">'+esc(c.name)+'</span>';bindCard(b,id);return b;}
function renderField(){const own=D.players[0],foe=D.players[1];$('own-lands').replaceChildren();$('opponent-lands').replaceChildren();$('opponent-units').replaceChildren();const ownL=own.battlefield.filter(id=>C[id].land),foeL=foe.battlefield.filter(id=>C[id].land),units=foe.battlefield.filter(id=>!C[id].land);for(let n=0;n<(dense?3:1);n++){ownL.forEach(id=>$('own-lands').append(land(id,n)));foeL.forEach(id=>$('opponent-lands').append(land(id,n)));}for(let n=0;n<(dense?3:1);n++)units.forEach(id=>$('opponent-units').append(permanent(id)));}
function renderHand(){D.players[0].hand.forEach(id=>{const c=C[id],b=document.createElement('button');b.className='hand-card';b.dataset.zone='hand';b.setAttribute('aria-label',c.name+'，查看');b.innerHTML='<img class="hand-image" src="'+c.image+'" alt="'+esc(c.name)+'"><span class="cost" aria-label="当前费用">'+mana(c.cost)+'</span><span class="h-name">'+esc(c.name)+'</span>';bindCard(b,id);$('hand-row').append(b);});}
function renderStack(){const source=D.stack.find(s=>s.id===selectedStack);$('stack-list').replaceChildren();D.stack.forEach((s,index)=>{const c=C[s.cardId],b=document.createElement('button'),isTarget=source&&source.targets.includes(s.id);b.className='stack-entry '+(s.owner===1?'self':'foe')+(s.id===selectedStack?' selected':'')+(isTarget?' is-target':'');b.dataset.action='stack';b.dataset.stackId=s.id;b.dataset.cardId=s.cardId;b.setAttribute('aria-label',s.name+'，'+(s.owner===1?'你的':'对手的')+'咒语');b.setAttribute('aria-pressed',s.id===selectedStack?'true':'false');b.innerHTML='<img src="'+c.image+'" alt=""><h3>'+esc(s.name)+'</h3><span class="owner">'+(s.owner===1?'你':'对手')+'</span><span class="kind">'+(index===0?'先结算':'后结算')+' · '+esc(c.type)+'</span><span class="relationship">'+(isTarget?'被对手指定为目标':s.targets.length?'目标：'+esc(C[D.stack.find(t=>t.id===s.targets[0]).cardId].name):esc(s.note))+'</span>';b.addEventListener('mouseenter',()=>showInspect(s.cardId));b.addEventListener('focus',()=>showInspect(s.cardId));b.addEventListener('click',()=>{selectedStack=s.id;pinned=false;renderStack();showInspect(s.cardId,true);});$('stack-list').append(b);});}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800);}
function openZone(seat,zone){const p=D.players.find(p=>p.seat===seat),ids=p[zone];$('browse-title').textContent=(seat===1?'你的':'对手的')+(zone==='graveyard'?'坟墓场':'放逐区')+' · '+ids.length;$('browse-grid').replaceChildren();if(!ids.length){$('browse-grid').innerHTML='<div class="browse-empty">这里暂时没有牌</div>';}ids.forEach(id=>{const c=C[id],b=document.createElement('button');b.className='browse-card';b.innerHTML='<img src="'+c.image+'" alt="'+esc(c.name)+'"><span>'+esc(c.name)+'</span>';bindCard(b,id);$('browse-grid').append(b);});$('browse-backdrop').classList.add('open');}
function history(open){const button=document.querySelector('[data-action="history"]');$('history-panel').classList.toggle('open',open);button.classList.toggle('active',open);button.setAttribute('aria-expanded',String(open));}
document.querySelector('[data-action="history"]').addEventListener('click',()=>history(!$('history-panel').classList.contains('open')));document.querySelector('[data-action="history-close"]').addEventListener('click',()=>history(false));
document.querySelectorAll('[data-action="graveyard"],[data-action="exile"]').forEach(b=>b.addEventListener('click',()=>openZone(Number(b.dataset.seat),b.dataset.action)));
document.querySelectorAll('[data-action="library"]').forEach(b=>b.addEventListener('click',()=>toast('牌库保持隐藏')));
document.querySelector('[data-action="inspect-pin"]').addEventListener('click',()=>{pinned=!pinned;updatePin();});document.querySelector('[data-action="inspect-close"]').addEventListener('click',()=>{pinned=false;$('inspector').classList.add('hidden');updatePin();});
document.querySelector('[data-action="browse-close"]').addEventListener('click',()=>$('browse-backdrop').classList.remove('open'));$('browse-backdrop').addEventListener('click',e=>{if(e.target===$('browse-backdrop'))$('browse-backdrop').classList.remove('open');});
document.querySelector('[data-action="pass"]').addEventListener('click',e=>{e.currentTarget.textContent='等待对手';e.currentTarget.disabled=true;$('priority-text').textContent='对手的优先权';toast('已让过优先权');});
document.querySelector('[data-action="mode"]').addEventListener('click',()=>$('mode-menu').classList.toggle('open'));document.querySelectorAll('#mode-menu button').forEach(b=>b.addEventListener('click',()=>{document.querySelector('[data-action="mode"]').textContent=b.textContent+' ⌄';$('mode-menu').classList.remove('open');}));
$('view-board').addEventListener('click',()=>{pinned=false;$('inspector').classList.add('hidden');$('browse-backdrop').classList.remove('open');history(false);updatePin();});$('settings').addEventListener('click',()=>toast('设置'));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('browse-backdrop').classList.remove('open');history(false);pinned=false;$('inspector').classList.add('hidden');updatePin();}});
$('hidden-hand').innerHTML='<span>手牌 '+D.players[1].handCount+'</span>'+Array.from({length:D.players[1].handCount},()=>'<img src="'+D.assets.back+'" alt="对手的隐藏手牌">').join('');$('history-list').innerHTML=D.history.map(s=>'<li>'+esc(s)+'</li>').join('');
window.setDense=value=>{dense=Boolean(value);arena.classList.toggle('dense',dense);renderField();};
renderField();renderHand();renderStack();showInspect(D.initialInspect,true);document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
