<!--
  沉浸牌桌：真实录像场面，不执行规则。
  用户新增方向：详情与历史共享左侧固定侧栏，用标签页切换；右侧堆叠保留。
  横排手牌独占底部；历史悬停不抢标签，明确点击卡牌才打开详情。
  本版从 C 派生，旧 C 保留比较。原探索：
  不再向战场里堆弹窗。对手在上、你在下，右侧保留反击链和优先权。
  这里刻意保留己方没有生物时的留白，不用虚构永久物填满画面。
  用户校正：视频只参考横排手牌。中央独立设计为有厚度的石质竞技场，
  原有景观只在边缘显露；所有景观、地面与边缘层均不参与指针命中。
-->

<aside class="stack-area" aria-label="堆叠"><div class="stack-heading">堆叠<span>从上到下结算</span></div><div id="stack-list"></div></aside>
<section class="priority"><span class="priority-message" id="priority-message">轮到你响应</span><button class="pass-button" data-action="pass" id="pass-button">让过优先权<span>→</span></button><div class="mode-row"><span>第10回合 · 你的回合</span><button data-action="auto" aria-pressed="false">手动</button></div></section>
<section class="dock" aria-label="你的横排手牌"><div class="hand-region"><div class="hand-heading">手牌 <b id="hand-count">5</b><span class="hint">当前无可施放的牌</span></div><div class="hand-line" id="hand"></div></div></section>
<aside class="info-rail" id="info-rail" aria-label="卡牌详情与对局历史">
  <div class="info-tabs" role="tablist" aria-label="信息侧栏">
    <button id="details-tab" role="tab" aria-selected="true" aria-controls="details-panel" data-action="info-tab" data-tab="details" tabindex="0">详情</button>
    <button id="history-tab" role="tab" aria-selected="false" aria-controls="history" data-action="info-tab" data-tab="history" tabindex="-1">历史</button>
  </div>
  <section class="info-panel" id="details-panel" role="tabpanel" aria-labelledby="details-tab">
    <span class="reader-empty" id="reader-empty" hidden>悬停卡牌查看详情<br>也可以点击卡牌固定</span>
    <aside class="reader" id="reader" aria-label="卡牌详情"><button class="reader-photo" data-action="zoom" aria-label="查看完整牌面"><img id="reader-image" alt=""></button><div class="reading"><div class="reader-toolbar"><button data-action="pin" aria-pressed="false">固定</button><button data-action="inspect-close" class="close" aria-label="关闭卡牌详情">×</button></div><h2 class="reader-title" id="reader-title"></h2><div class="reader-meta"><span id="reader-type"></span><span id="reader-cost" class="mana"></span></div><div class="reader-rules" id="reader-rules"></div><div class="reader-cost-change" id="reader-cost-change"></div></div></aside>
  </section>
  <section class="info-panel history-panel" id="history" role="tabpanel" aria-labelledby="history-tab" hidden>
    <div class="history-turn"><strong>第 10 回合</strong><small>你的回合 · 战斗前主要阶段</small></div>
    <ol class="history-list" id="history-list"></ol>
    <div class="history-end">当前记录到对手指定目标</div>
  </section>
</aside>
<aside class="drawer" id="browser" hidden aria-label="公开区域浏览"><div class="drawer-header"><h2 id="browser-title"></h2><button data-action="browser-close" class="drawer-close" aria-label="关闭区域浏览">×</button></div><div id="browser-list" class="drawer-list"></div></aside>
<div class="zoom" id="zoom" hidden role="dialog" aria-modal="true" aria-label="完整牌面"><button class="zoom-close" data-action="zoom-close" aria-label="关闭完整牌面">×</button><img id="zoom-image" alt=""><div class="zoom-copy"><small id="zoom-type"></small><h2 id="zoom-name"></h2><p id="zoom-rules"></p></div></div>
</main></div><script src="scene-data.js"></script><script src="full-layout-data.js"></script><script>
(()=>{
'use strict';const D=window.MTGB_DATA,$=s=>document.querySelector(s),cards=D.cards;const own=D.players.find(p=>p.seat===1),other=D.players.find(p=>p.seat===2);
let activeCard=D.initialInspect,pinned=false,selectedStack=D.stack[0].id,dense=false,activeInfoTab='details';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mana(cost){if(!cost||cost==='no cost')return'';return[...cost.matchAll(/\{([^}]+)\}/g)].map(([,s])=>D.assets.mana[s]?`<img src="${D.assets.mana[s]}" alt="${esc(s)}">`:`<span class="generic">${esc(s)}</span>`).join('');}
function rules(text){return esc(text).replace(/\{([^}]+)\}/g,(_,s)=>({W:'白',U:'蓝',B:'黑',R:'红',G:'绿',T:'横置',E:'能量'}[s]||s));}
function fit(){const scale=Math.min(innerWidth/1600,innerHeight/900);$('#fit').style.transform=`translate(-50%,-50%) scale(${scale})`;}
addEventListener('resize',fit);fit();$('#table').style.setProperty('--mat',`url("${'assets/battlefield-source.png'}")`);
$('#turn').textContent=D.turn;$('#phase').textContent=D.phase;$('#our-life').textContent=own.life;$('#their-life').textContent=other.life;$('#hand-count').textContent=own.hand.length;$('#their-hand-summary').textContent='手牌 '+other.handCount;
$('#private-hand').innerHTML=Array.from({length:other.handCount},()=>`<img src="${D.assets.back}" alt="对手的隐藏手牌">`).join('')+`<span>${other.handCount} 张</span>`;
function zones(p,target){$(target).innerHTML=`<button class="zone-link" disabled aria-label="${p.name}的牌库${p.library}张"><span>牌库</span><b>${p.library}</b></button><button class="zone-link" data-action="graveyard" data-seat="${p.seat}" aria-label="查看${p.name}的坟墓场"><span>坟墓场</span><b>${p.graveyard.length}</b></button><button class="zone-link" data-action="exile" data-seat="${p.seat}" aria-label="查看${p.name}的放逐区"><span>放逐</span><b>${p.exile.length}</b></button>`;}
zones(own,'#our-zones');zones(other,'#their-zones');
function land(id){const c=cards[id];return`<button class="land-card ${c.tapped?'tapped':''}" data-card-id="${id}" data-zone="battlefield" aria-label="${esc(c.name)}${c.tapped?'，已横置':''}"><span class="land-art"><img src="${c.image}" alt="${esc(c.name)}"></span><span class="land-name">${esc(c.name)}</span></button>`;}
function permanent(id){const c=cards[id];return`<button class="permanent" data-card-id="${id}" data-zone="battlefield" aria-label="${esc(c.name)}${c.creature?'，'+c.power+'/'+c.toughness:''}"><img src="${c.image}" alt="${esc(c.name)}">${c.creature?`<span class="power">${c.power}/${c.toughness}</span>`:''}<span class="permanent-name">${esc(c.name)}</span></button>`;}

const L=window.MTGB_LAYOUT;
function refreshLaneArrows(){document.querySelectorAll('.lane-track').forEach(track=>{document.querySelectorAll('[data-scroll="'+track.id+'"]').forEach(b=>{b.hidden=track.scrollWidth<=track.clientWidth+2;b.disabled=Number(b.dataset.scrollDirection)<0?track.scrollLeft<=2:track.scrollLeft>=track.scrollWidth-track.clientWidth-2;});});}
function layoutCard(id,lane){const c=cards[id],land=lane.endsWith('lands'),support=lane.endsWith('support'),special=lane.endsWith('walkers')||lane.endsWith('battles'),value=c.creature?c.power+'/'+c.toughness:c.loyalty!==undefined?'忠诚 '+c.loyalty:c.defense!==undefined?'防御 '+c.defense:'';return `<button class="lane-card ${land?'land-tile':''} ${support?'support-tile':''} ${special?'special-tile':''} ${c.tapped?'tapped':''}" data-card-id="${id}" data-zone="battlefield" data-seat="${c.owner}" aria-label="${c.owner===1?'你的':'对手的'}${esc(c.name)}${value?'，'+value:''}${c.sick?'，召唤失调':''}"><span class="tile-face"><img src="${c.image}" alt="${esc(c.name)}"></span>${value?`<span class="tile-value">${value}</span>`:''}${c.sick?'<span class="sick">失调</span>':''}<span class="tile-name">${esc(c.name)}</span></button>`;}
function renderBoard(){for(const [lane,base] of Object.entries(L.lanes)){const ids=[...base];if(dense)for(let n=1;n<4;n++)for(const id of base){const copy=id+'-dense-'+n;cards[copy]={...cards[id],id:copy};ids.push(copy);}document.getElementById(lane).innerHTML=ids.map(id=>layoutCard(id,lane)).join('');document.getElementById(lane).onscroll=refreshLaneArrows;document.getElementById(lane+'-count').textContent=ids.length;}$('#table').classList.toggle('dense',dense);requestAnimationFrame(refreshLaneArrows);}
function renderResources(seat){const r=L.resources[seat],icon=kind=>{const i=L.icons.find(x=>x.kind===kind);return `<span class="counter-symbol" style="height:${i.height/2}px;background-size:${L.atlasSize[0]/2}px ${L.atlasSize[1]/2}px;background-position:${-i.x/2}px ${-i.y/2}px"></span>`;};document.getElementById('resources-'+seat).innerHTML=`<div class="resource-row" aria-label="玩家指示物"><span class="resource-caption">指示物</span>${r.counters.map(([kind,name,count])=>`<span class="counter-chip" title="${name}指示物 ${count}" aria-label="${name}指示物 ${count}">${icon(kind)}<span>${name}</span><b>${count}</b></span>`).join('')}</div><div class="resource-row" aria-label="法术力池"><span class="resource-caption">法术力</span><div class="mana-pool">${r.mana.map(([symbol,count])=>`<span class="pool-item" aria-label="${symbol}法术力 ${count}">${D.assets.mana[symbol]?`<img src="${D.assets.mana[symbol]}" alt="${symbol}">`:'<span class="generic">C</span>'}<span>${count}</span></span>`).join('')}</div></div>`;}
for(const seat of ['1','2']){renderResources(seat);document.getElementById('states-'+seat).innerHTML=`<span class="state-owner">${seat==='1'?'己方':'对手'}<br>状态</span>`+[['command','统帅区','可查看统帅'],['emblems','徽记','泰菲力'],['delayed','延迟效果','下一结束步骤'],['states','持续状态','君主'],['dungeons','地城','黑暗之池']].map(([group,name,status])=>{const ids=L.groups[seat][group],c=cards[ids[0]];return `<button class="state-chip" data-action="layout-group" data-group="${group}" data-seat="${seat}" aria-label="查看${seat==='1'?'你的':'对手的'}${name}${ids.length}">${c.image?`<img src="${c.image}" alt="">`:''}<span class="state-label"><b>${name} ${ids.length}</b><small>${status}</small></span></button>`;}).join('');}
function openLayoutGroup(seat,group){const ids=L.groups[seat][group],names={command:'统帅区',emblems:'徽记',delayed:'延迟效果',states:'持续状态',dungeons:'地城'};$('#browser').hidden=false;$('#browser-title').textContent=(seat==='1'?'你的':'对手的')+names[group]+' · '+ids.length;$('#browser-list').className='drawer-list';$('#browser-list').innerHTML=ids.map(id=>`<button class="browse-card" data-card-id="${id}" aria-label="查看${esc(cards[id].name)}">${cards[id].image?`<img src="${cards[id].image}" alt="${esc(cards[id].name)}">`:`<span class="status-standin">${esc(cards[id].name)}</span>`}<span>${esc(cards[id].name)}</span></button>`).join('');}
addEventListener('resize',()=>requestAnimationFrame(refreshLaneArrows));
renderBoard();

$('#hand').innerHTML=own.hand.map(id=>{const c=cards[id];return`<button class="hand-card" data-card-id="${id}" data-zone="hand" aria-label="查看手牌${esc(c.name)}"><img src="${c.image}" alt="${esc(c.name)}"><span class="hand-cost mana">${mana(c.cost)}</span></button>`;}).join('');
function showCard(id,force=false){if(!cards[id]||(pinned&&!force))return;activeCard=id;const c=cards[id];$('#reader').hidden=false;$('#reader-empty').hidden=true;$('.reader-photo').hidden=!c.image;if(c.image){$('#reader-image').src=c.image;$('#reader-image').alt=c.name;}$('#reader-title').textContent=c.name;$('#reader-type').textContent=c.type;$('#reader-cost').innerHTML=mana(c.cost);$('#reader-rules').innerHTML=rules(c.rules);const diff=c.cost!==c.printedCost&&c.printedCost!=='no cost';$('#reader-cost-change').style.display=diff?'flex':'none';$('#reader-cost-change').innerHTML=diff?'印刷费用 <span class="mana">'+mana(c.printedCost)+'</span>':'';document.querySelectorAll('.hand-card,.lane-card').forEach(el=>el.classList.toggle('picked',el.dataset.cardId===id));}
function renderStack(){const selected=D.stack.find(s=>s.id===selectedStack);$('#stack-list').innerHTML=D.stack.map((s,i)=>{const c=cards[s.cardId],targeted=selected?.targets.includes(s.id);return`<button class="stack-item ${s.owner===1?'self':''} ${s.id===selectedStack?'selected':''} ${targeted?'targeted':''}" data-action="stack" data-stack-id="${s.id}" data-card-id="${s.cardId}" aria-label="${s.owner===1?'你的':'对手的'}${esc(s.name)}${i===0?'，先结算':''}"><img class="stack-thumb" src="${c.image}" alt=""><span class="stack-copy"><span class="stack-owner">${s.owner===1?'你':'对手'} · ${i===0?'先结算':'后结算'}</span><span class="stack-name">${esc(s.name)}</span><span class="stack-note">${esc(s.note)}</span>${s.targets.length?`<span class="target-note"><span class="stack-arrow">↳</span>指向 ${esc(cards[D.stack.find(x=>x.id===s.targets[0]).cardId].name)}</span>`:''}${targeted?'<span class="target-note">对手咒语的目标</span>':''}</span></button>`;}).join('');}
renderStack();showCard(activeCard);
function selectInfoTab(tab,focus=false){
 activeInfoTab=tab;$('#info-rail').hidden=false;$('#details-panel').hidden=tab!=='details';$('#history').hidden=tab!=='history';
 document.querySelectorAll('[data-action="info-tab"]').forEach(el=>{const selected=el.dataset.tab===tab;el.setAttribute('aria-selected',String(selected));el.tabIndex=selected?0:-1;if(selected&&focus)el.focus();});
}
function togglePin(){pinned=!pinned;const p=$('[data-action=pin]');p.classList.toggle('pinned',pinned);p.textContent=pinned?'已固定':'固定';p.setAttribute('aria-pressed',String(pinned));}
function browse(seat,zone){const p=D.players.find(p=>p.seat===Number(seat)),list=p[zone];$('#browser').hidden=false;$('#browser-title').textContent=`${p.seat===1?'你的':'对手的'}${zone==='graveyard'?'坟墓场':'放逐区'} · ${list.length}`;$('#browser-list').className=list.length?'drawer-list':'empty-zone';$('#browser-list').innerHTML=list.length?list.map(id=>`<button class="browse-card" data-card-id="${id}" aria-label="查看${esc(cards[id].name)}"><img src="${cards[id].image}" alt="${esc(cards[id].name)}"><span>${esc(cards[id].name)}</span></button>`).join(''):'当前没有牌';}
function historyCard(id,note){const c=cards[id];return `<button class="history-card" data-card-id="${id}" aria-label="查看历史中的${esc(c.name)}"><img src="${c.image}" alt=""><span><b>${esc(c.name)}</b><small>${esc(note)}</small></span></button>`;}
const top=D.stack[0],bottom=D.stack[1];
$('#history-list').innerHTML=`<li class="history-event mine"><div class="event-heading"><span class="event-owner">你</span><strong>施放咒语</strong></div>${historyCard(bottom.cardId,'X = 2 · 进入堆叠')}</li><li class="history-event enemy"><div class="event-heading"><span class="event-owner">对手</span><strong>施放咒语</strong></div>${historyCard(top.cardId,'进入堆叠 · 先结算')}</li><li class="history-event enemy"><div class="event-heading"><span class="event-owner">对手</span><strong>指定目标</strong></div>${historyCard(top.cardId,'来源咒语')}<div class="history-target">${historyCard(bottom.cardId,'↳ 成为对手咒语的目标')}</div></li>`;
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-card-id]');if(el)showCard(el.dataset.cardId);});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-card-id]');if(el)showCard(el.dataset.cardId);});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const action=el.dataset.action;
if(action==='info-tab')selectInfoTab(el.dataset.tab);
else if(action==='info-open')selectInfoTab(activeInfoTab);
else if(action==='history'){selectInfoTab('history');$('#browser').hidden=true;}
else if(action==='menu'){$('#menu').hidden=!$('#menu').hidden;el.setAttribute('aria-expanded',String(!$('#menu').hidden));}
else if(action==='view-battlefield'){$('#menu').hidden=true;$('#info-rail').hidden=true;$('#browser').hidden=true;}
else if(action==='reset-view'){$('#menu').hidden=true;selectInfoTab('details');$('#browser').hidden=true;$('#zoom').hidden=true;if(pinned)togglePin();selectedStack=D.stack[0].id;renderStack();showCard(D.initialInspect,true);}
else if(action==='history-close')selectInfoTab('details');
else if(action==='browser-close')$('#browser').hidden=true;
else if(action==='layout-group')openLayoutGroup(el.dataset.seat,el.dataset.group);
else if(action==='global-state'){selectInfoTab('details');if(pinned)togglePin();$('#reader').hidden=false;$('.reader-photo').hidden=true;$('#reader-title').textContent=el.textContent;$('#reader-type').textContent='公共对局状态';$('#reader-cost').innerHTML='';$('#reader-cost-change').style.display='none';$('#reader-rules').textContent=el.textContent==='白昼'?'当前为白昼。':'公共全局效果在这里集中查看。';}
else if(action==='graveyard'||action==='exile')browse(el.dataset.seat,action);
else if(action==='stack'){selectedStack=el.dataset.stackId;renderStack();selectInfoTab('details');showCard(el.dataset.cardId,true);}
else if(action==='pin')togglePin();
else if(action==='inspect-close'){$('#reader').hidden=true;$('#reader-empty').hidden=false;if(pinned)togglePin();}
else if(action==='zoom'){const c=cards[activeCard];$('#zoom-image').src=c.image;$('#zoom-image').alt=c.name;$('#zoom-name').textContent=c.name;$('#zoom-type').textContent=c.type;$('#zoom-rules').innerHTML=rules(c.rules);$('#zoom').hidden=false;}
else if(action==='zoom-close')$('#zoom').hidden=true;
else if(action==='pass'){$('#priority-message').textContent=$('#priority-message').textContent==='轮到你响应'?'对手响应中':'轮到你响应';$('#pass-button').childNodes[0].textContent=$('#priority-message').textContent==='轮到你响应'?'让过优先权':'等待对手';}
else if(action==='auto'){const on=el.getAttribute('aria-pressed')==='true';el.setAttribute('aria-pressed',String(!on));el.textContent=on?'手动':'自动';}
else if(el.dataset.scroll)document.getElementById(el.dataset.scroll).scrollBy({left:400*(Number(el.dataset.scrollDirection)||1),behavior:'auto'});
else if(el.dataset.cardId){selectInfoTab('details');showCard(el.dataset.cardId,true);if(!pinned)togglePin();}
});
document.addEventListener('keydown',e=>{if(e.target.closest('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();selectInfoTab(e.key==='Home'?'details':e.key==='End'?'history':activeInfoTab==='details'?'history':'details',true);return;}if(e.key==='Escape'){if(!$('#zoom').hidden)$('#zoom').hidden=true;else if(!$('#menu').hidden)$('#menu').hidden=true;else if(!$('#browser').hidden)$('#browser').hidden=true;else if(!$('#history').hidden)selectInfoTab('details');else if(pinned)togglePin();}});
window.setDense=value=>{dense=!!value;renderBoard();};
})();
</script></body></html>
