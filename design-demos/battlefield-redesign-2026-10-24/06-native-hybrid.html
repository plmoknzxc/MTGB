<!--
  沉浸牌桌：真实录像场面，不执行规则。
  用户新增方向：详情与历史共享左侧固定侧栏，用标签页切换；右侧堆叠保留。
  横排手牌独占底部；历史悬停不抢标签，明确点击卡牌才打开详情。
  本版从 C 派生，旧 C 保留比较。原探索：
  不再向战场里堆弹窗。对手在上、你在下，右侧保留反击链和优先权。
  这里刻意保留己方没有生物时的留白，不用虚构永久物填满画面。
  用户校正：视频只参考横排手牌。中央独立设计为有厚度的石质竞技场，
  原有景观只在边缘显露；所有景观、地面与边缘层均不参与指针命中。
-->

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function rules(text){return esc(text).replace(/\{([^}]+)\}/g,(_,s)=>({W:'白',U:'蓝',B:'黑',R:'红',G:'绿',T:'横置',E:'能量'}[s]||s));}

$('#turn').textContent=D.turn;$('#phase').textContent=D.phase;$('#our-life').textContent=own.life;$('#their-life').textContent=other.life;$('#hand-count').textContent=own.hand.length;$('#their-hand-summary').textContent='手牌 '+other.handCount;
$('#private-hand').innerHTML=Array.from({length:other.handCount},()=>`<img src="${D.assets.back}" alt="对手的隐藏手牌">`).join('')+`<span>${other.handCount} 张</span>`;
function zones(p,target){$(target).innerHTML=`<button class="zone-link" disabled aria-label="${p.name}的牌库${p.library}张"><span>牌库</span><b>${p.library}</b></button><button class="zone-link" data-action="graveyard" data-seat="${p.seat}" aria-label="查看${p.name}的坟墓场"><span>坟墓场</span><b>${p.graveyard.length}</b></button><button class="zone-link" data-action="exile" data-seat="${p.seat}" aria-label="查看${p.name}的放逐区"><span>放逐</span><b>${p.exile.length}</b></button>`;}
zones(own,'#our-zones');zones(other,'#their-zones');
function land(id){const c=cards[id];return`<button class="land-card ${c.tapped?'tapped':''}" data-card-id="${id}" data-zone="battlefield" aria-label="${esc(c.name)}${c.tapped?'，已横置':''}"><span class="land-art"><img src="${c.image}" alt="${esc(c.name)}"></span><span class="land-name">${esc(c.name)}</span></button>`;}
function permanent(id){const c=cards[id];return`<button class="permanent" data-card-id="${id}" data-zone="battlefield" aria-label="${esc(c.name)}${c.creature?'，'+c.power+'/'+c.toughness:''}"><img src="${c.image}" alt="${esc(c.name)}">${c.creature?`<span class="power">${c.power}/${c.toughness}</span>`:''}<span class="permanent-name">${esc(c.name)}</span></button>`;}
function renderBoard(){const enemyLands=other.battlefield.filter(id=>cards[id].land),ourLands=own.battlefield.filter(id=>cards[id].land),creatures=other.battlefield.filter(id=>cards[id].creature),supports=other.battlefield.filter(id=>!cards[id].creature&&!cards[id].land);$('#enemy-lands').innerHTML=(dense?[...enemyLands,...enemyLands,...enemyLands]:enemyLands).map(land).join('');$('#own-lands').innerHTML=(dense?[...ourLands,...ourLands,...ourLands]:ourLands).map(land).join('');$('#enemy-permanents').innerHTML=(dense?[...creatures,...creatures,...creatures]:creatures).map(permanent).join('')+`<div class="support">${supports.map(permanent).join('')}</div>`;$('#table').classList.toggle('dense',dense);}
renderBoard();
$('#hand').innerHTML=own.hand.map(id=>{const c=cards[id];return`<button class="hand-card" data-card-id="${id}" data-zone="hand" aria-label="查看手牌${esc(c.name)}"><img src="${c.image}" alt="${esc(c.name)}"><span class="hand-cost mana">${mana(c.cost)}</span></button>`;}).join('');
function showCard(id,force=false){if(!cards[id]||(pinned&&!force))return;activeCard=id;const c=cards[id];$('#reader').hidden=false;$('#reader-empty').hidden=true;$('.reader-photo').hidden=!c.image;if(c.image){$('#reader-image').src=c.image;$('#reader-image').alt=c.name;}$('#reader-title').textContent=c.name;$('#reader-type').textContent=c.type;$('#reader-cost').innerHTML=mana(c.cost);$('#reader-rules').innerHTML=rules(c.rules);const diff=c.cost!==c.printedCost&&c.printedCost!=='no cost';$('#reader-cost-change').style.display=diff?'flex':'none';$('#reader-cost-change').innerHTML=diff?'印刷费用 <span class="mana">'+mana(c.printedCost)+'</span>':'';document.querySelectorAll('.hand-card').forEach(el=>el.classList.toggle('picked',el.dataset.cardId===id));}
function renderStack(){const selected=D.stack.find(s=>s.id===selectedStack);$('#stack-list').innerHTML=D.stack.map((s,i)=>{const c=cards[s.cardId],targeted=selected?.targets.includes(s.id);return`<button class="stack-item ${s.owner===1?'self':''} ${s.id===selectedStack?'selected':''} ${targeted?'targeted':''}" data-action="stack" data-stack-id="${s.id}" data-card-id="${s.cardId}" aria-label="${s.owner===1?'你的':'对手的'}${esc(s.name)}${i===0?'，先结算':''}"><img class="stack-thumb" src="${c.image}" alt=""><span class="stack-copy"><span class="stack-owner">${s.owner===1?'你':'对手'} · ${i===0?'先结算':'后结算'}</span><span class="stack-name">${esc(s.name)}</span><span class="stack-note">${esc(s.note)}</span>${s.targets.length?`<span class="target-note"><span class="stack-arrow">↳</span>指向 ${esc(cards[D.stack.find(x=>x.id===s.targets[0]).cardId].name)}</span>`:''}${targeted?'<span class="target-note">对手咒语的目标</span>':''}</span></button>`;}).join('');}
renderStack();showCard(activeCard);
function selectInfoTab(tab,focus=false){
 activeInfoTab=tab;$('#info-rail').hidden=false;$('#details-panel').hidden=tab!=='details';$('#history').hidden=tab!=='history';
 document.querySelectorAll('[data-action="info-tab"]').forEach(el=>{const selected=el.dataset.tab===tab;el.setAttribute('aria-selected',String(selected));el.tabIndex=selected?0:-1;if(selected&&focus)el.focus();});
}
function togglePin(){pinned=!pinned;const p=$('[data-action=pin]');p.classList.toggle('pinned',pinned);p.textContent=pinned?'已固定':'固定';p.setAttribute('aria-pressed',String(pinned));}
function browse(seat,zone){const p=D.players.find(p=>p.seat===Number(seat)),list=p[zone];$('#browser').hidden=false;$('#browser-title').textContent=`${p.seat===1?'你的':'对手的'}${zone==='graveyard'?'坟墓场':'放逐区'} · ${list.length}`;$('#browser-list').className=list.length?'drawer-list':'empty-zone';$('#browser-list').innerHTML=list.length?list.map(id=>`<button class="browse-card" data-card-id="${id}" aria-label="查看${esc(cards[id].name)}"><img src="${cards[id].image}" alt="${esc(cards[id].name)}"><span>${esc(cards[id].name)}</span></button>`).join(''):'当前没有牌';}
function historyCard(id,note){const c=cards[id];return `<button class="history-card" data-card-id="${id}" aria-label="查看历史中的${esc(c.name)}"><img src="${c.image}" alt=""><span><b>${esc(c.name)}</b><small>${esc(note)}</small></span></button>`;}
const top=D.stack[0],bottom=D.stack[1];
$('#history-list').innerHTML=`<li class="history-event mine"><div class="event-heading"><span class="event-owner">你</span><strong>施放咒语</strong></div>${historyCard(bottom.cardId,'X = 2 · 进入堆叠')}</li><li class="history-event enemy"><div class="event-heading"><span class="event-owner">对手</span><strong>施放咒语</strong></div>${historyCard(top.cardId,'进入堆叠 · 先结算')}</li><li class="history-event enemy"><div class="event-heading"><span class="event-owner">对手</span><strong>指定目标</strong></div>${historyCard(top.cardId,'来源咒语')}<div class="history-target">${historyCard(bottom.cardId,'↳ 成为对手咒语的目标')}</div></li>`;
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-card-id]');if(el)showCard(el.dataset.cardId);});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-card-id]');if(el)showCard(el.dataset.cardId);});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const action=el.dataset.action;
if(action==='info-tab')selectInfoTab(el.dataset.tab);
else if(action==='info-open')selectInfoTab(activeInfoTab);
else if(action==='history'){selectInfoTab('history');$('#browser').hidden=true;}
else if(action==='menu'){$('#menu').hidden=!$('#menu').hidden;el.setAttribute('aria-expanded',String(!$('#menu').hidden));}
else if(action==='view-battlefield'){$('#menu').hidden=true;$('#info-rail').hidden=true;$('#browser').hidden=true;}
else if(action==='reset-view'){$('#menu').hidden=true;selectInfoTab('details');$('#browser').hidden=true;$('#zoom').hidden=true;if(pinned)togglePin();selectedStack=D.stack[0].id;renderStack();showCard(D.initialInspect,true);}
else if(action==='history-close')selectInfoTab('details');
else if(action==='browser-close')$('#browser').hidden=true;
else if(action==='graveyard'||action==='exile')browse(el.dataset.seat,action);
else if(action==='stack'){selectedStack=el.dataset.stackId;renderStack();selectInfoTab('details');showCard(el.dataset.cardId,true);}
else if(action==='pin')togglePin();
else if(action==='inspect-close'){$('#reader').hidden=true;$('#reader-empty').hidden=false;if(pinned)togglePin();}
else if(action==='zoom'){const c=cards[activeCard];$('#zoom-image').src=c.image;$('#zoom-image').alt=c.name;$('#zoom-name').textContent=c.name;$('#zoom-type').textContent=c.type;$('#zoom-rules').innerHTML=rules(c.rules);$('#zoom').hidden=false;}
else if(action==='zoom-close')$('#zoom').hidden=true;
else if(action==='pass'){el.classList.add('pressed');setTimeout(()=>el.classList.remove('pressed'),180);}
else if(action==='pause-next'){el.setAttribute('aria-pressed',String(el.getAttribute('aria-pressed')!=='true'));}
else if(action==='auto'){const modes=['手动','自动','略过'];el.textContent=modes[(modes.indexOf(el.textContent)+1)%3];}
else if(action==='scroll-hand')$('#hand').scrollBy({left:Number(el.dataset.direction)*300,behavior:'auto'});
else if(el.dataset.scroll)document.getElementById(el.dataset.scroll).scrollBy({left:400,behavior:'smooth'});
else if(el.dataset.cardId){selectInfoTab('details');showCard(el.dataset.cardId,true);if(!pinned)togglePin();}
});
document.addEventListener('keydown',e=>{if(e.target.closest('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();selectInfoTab(e.key==='Home'?'details':e.key==='End'?'history':activeInfoTab==='details'?'history':'details',true);return;}if(e.key==='Escape'){if(!$('#zoom').hidden)$('#zoom').hidden=true;else if(!$('#menu').hidden)$('#menu').hidden=true;else if(!$('#browser').hidden)$('#browser').hidden=true;else if(!$('#history').hidden)selectInfoTab('details');else if(pinned)togglePin();}});
window.setDense=()=>{};window.updatePreviewStack=items=>{D.stack=items;selectedStack=items[0]?.id;renderStack();};
})();
</script>
<script>
(()=>{
const D=window.MTGB_DATA,N=window.MTGB_NATIVE_CAPTURE,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ids=Object.keys(window.MTGB_LAYOUT.cards),objects=N.objects.filter(o=>o.kind==='protected-card');
const manaBounds=N.objects.find(o=>o.name==='ManaPoolChips').bounds,manaPanel=document.getElementById('own-mana-native'),manaImage=manaPanel.querySelector('img');manaPanel.style.width=(manaBounds.width+64)+'px';manaPanel.style.height=(manaBounds.height+8)+'px';Object.assign(manaImage.style,{width:N.width+'px',height:N.height+'px',left:-(manaBounds.x-32)+'px',top:-(manaBounds.y-4)+'px'});

function scrollState(){const h=document.getElementById('hand');document.querySelectorAll('[data-action=scroll-hand]').forEach(b=>{b.hidden=h.scrollWidth<=h.clientWidth+2;b.disabled=Number(b.dataset.direction)<0?h.scrollLeft<=2:h.scrollLeft>=h.scrollWidth-h.clientWidth-2;});}

const popup=document.getElementById('hand-pop');
const dock=document.querySelector('.dock');function setHand(raised){dock.dataset.hand=raised?'raised':'lowered';dock.setAttribute('aria-label',raised?'你的横排手牌，已展开':'你的横排手牌，已下沉');document.querySelector('.hand-heading .hint').textContent=raised?'点击战场收起 · 当前无可施放的牌':'点击手牌展开 · 当前无可施放的牌';popup.hidden=true;}setHand(true);

document.addEventListener('pointerover',e=>{const el=e.target.closest('.hand-card');if(!el||dock.dataset.hand==='lowered')return;const c=D.cards[el.dataset.cardId],r=el.getBoundingClientRect(),root=document.getElementById('table').getBoundingClientRect(),scale=root.width/N.width;document.getElementById('hand-pop-image').src=c.image;document.getElementById('hand-pop-image').alt=c.name;document.getElementById('hand-pop-cost').innerHTML=[...c.cost.matchAll(/\{([^}]+)\}/g)].map(([,v])=>D.assets.mana[v]?`<img src="${D.assets.mana[v]}" alt="${v}">`:`<span class="generic">${esc(v)}</span>`).join('');popup.style.left=Math.max(350,Math.min(940,(r.left-root.left)/scale+r.width/scale*.5-112.5))+'px';popup.style.top=(dock.dataset.hand==='raised'?356:479)+'px';popup.hidden=false;});
