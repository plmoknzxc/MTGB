<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTGB · 战场整体视觉方案</title><link rel="stylesheet" href="fonts.css"><style>
:root{color-scheme:dark;background:#101113;color:#dededb;font-family:GameSans,sans-serif}body{margin:0}button,a{font:inherit}button{cursor:pointer}header{height:64px;border-bottom:1px solid #343538;display:flex;align-items:center;gap:24px;padding:0 25px;background:#151618}header h1{font-size:16px;font-weight:500;margin:0;white-space:nowrap}header h1 span{font:18px GameSerif,serif;letter-spacing:.16em;margin-right:12px;color:#f2efe7}.tabs{display:flex;align-self:stretch;gap:25px}.tabs button{border:0;border-bottom:2px solid transparent;padding:0 2px;background:none;color:#979995;font-size:14px}.tabs button[aria-selected=true]{border-color:#d8c9a6;color:#f6f0e1}.tools{margin-left:auto;display:flex;align-items:center;gap:17px}.tools button,.tools a{background:none;border:0;color:#c2c3bd;font-size:12px;text-decoration:none;white-space:nowrap}.tools button[aria-pressed=true]{color:#e5c78e}.mode{display:flex;border:1px solid #424345}.mode button{padding:6px 10px;font-size:12px;background:none;border:0;color:#a5a6a2}.mode button[aria-pressed=true]{background:#343537;color:#fff}.viewer{height:calc(100vh - 108px);background:#090a0c;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}.compare{display:none;gap:22px;padding:32px 26px;align-content:start;grid-template-columns:repeat(2,minmax(0,1fr));height:100%;overflow:auto;background:#101113}.compare button{display:block;width:100%;padding:0;text-align:left;background:none;border:0;color:#e4e2dc}.compare img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#090a0c;outline:1px solid #404141;outline-offset:-1px;transition:outline-color .18s}.compare button:hover img{outline-color:#d5c5a1}.compare strong{display:block;font-size:19px;font-weight:500;margin-top:16px}.compare p{font-size:13px;line-height:1.8;color:#a5a6a0;max-width:37em;margin:7px 0 0}.compare .tag{font:12px GameSerif,serif;color:#bbaa87;letter-spacing:.12em}.compare .original{grid-column:1/-1;border-top:1px solid #343538;margin-top:20px;padding-top:20px;display:flex;align-items:center;gap:24px}.original img{width:28%;max-height:220px;object-fit:cover}.original section{flex:1}.original strong{margin:0}.native{display:none;height:100%;background:#0d0e11;position:relative}.native img{width:100%;height:100%;object-fit:contain}.native span{position:absolute;bottom:10px;left:14px;background:#141519da;padding:6px 9px;font-size:11px;color:#d8d2c3}footer{height:44px;border-top:1px solid #343538;display:flex;align-items:center;justify-content:space-between;padding:0 25px;color:#93968f;font-size:12px}footer .claim{color:#bdc1b4}button:focus-visible,a:focus-visible{outline:2px solid #e4c98c;outline-offset:5px}@media(max-width:1100px){header{gap:14px;padding:0 14px}.tabs{gap:14px}.tabs button{font-size:12px}header h1{font-size:12px}.tools{gap:10px}.tools .external{display:none}footer{padding:0 14px;font-size:11px}.compare{gap:14px;padding:22px 15px}.compare strong{font-size:15px}.compare p{font-size:12px}}@media(max-width:760px){.compare{grid-template-columns:1fr}.tools .current{display:none}header h1{display:none}footer .claim{max-width:45%;text-align:right}}
header h1{flex:none}.tabs{min-width:0;overflow-x:auto}.tabs button{flex:none;white-space:nowrap}.tools{flex-shrink:0}@media(max-width:1300px){header h1{display:none}.tabs{gap:18px}.tools{gap:12px}header{gap:20px}}
</style></head><body>
<header><h1><span>MTGB</span>战场设计</h1><nav class="tabs" aria-label="选择视觉方案"><button data-variant="0" aria-selected="false">A　清醒竞技场</button><button data-variant="1" aria-selected="false">B　阅读桌面</button><button data-variant="2" aria-selected="false">C　沉浸牌桌</button><button data-variant="3" aria-selected="false">D　详情与历史</button><button data-variant="4" aria-selected="false">E　完整区域</button><button data-variant="5" aria-selected="true">F　Unity战场＋新UI</button></nav><div class="tools"><button id="dense" aria-pressed="false">拥挤演示</button><button class="current" id="current" aria-pressed="false">当前界面</button><a class="external" id="standalone" href="06-native-hybrid.html" target="_blank">独立查看 ↗</a><div class="mode"><button id="interact" aria-pressed="true">交互</button><button id="overview" aria-pressed="false">对比</button></div></div></header>
<main class="viewer"><iframe id="preview" src="06-native-hybrid.html" title="Unity战场与新UI交互预览"></iframe><div class="compare" id="comparison"><button data-preview="0"><span class="tag">A · CALM ARENA</span><img src="preview-a.png?v=2" alt="清醒竞技场全貌"><strong>清醒竞技场</strong><p>石质竞技场与实体卡牌投影；横排手牌独立，堆叠与详情集中右侧。</p></button><button data-preview="1"><span class="tag">B · READING TABLE</span><img src="preview-b.png?v=2" alt="阅读桌面全貌"><strong>阅读桌面</strong><p>古典台面与温暖的材质层次；大图阅读放左侧，堆叠在右侧展开。</p></button><button data-preview="2"><span class="tag">C · IMMERSIVE TABLE</span><img src="preview-c.png?v=2" alt="沉浸牌桌全貌"><strong>沉浸牌桌</strong><p>遗迹场景与中央竞技场；横排手牌、横向阅读台独立于战场。</p></button><button data-preview="3"><span class="tag">D · SHARED SIDEBAR</span><img src="preview-d.png?v=players2" alt="详情与历史标签侧栏"><strong>详情与历史</strong><p>左侧共用详情／历史标签栏，右侧保留堆叠。双方改为大号生命值与独立玩家面板，点击历史卡图打开详情。</p></button><button data-preview="4"><span class="tag">E · COMPLETE BATTLEFIELD</span><img src="preview-e.png?v=1" alt="双方完整区域布局演示"><strong>完整区域布局</strong><p>双方生物、地、神器／结界、旅法、战役与资源全部展开；统帅区、徽记、延迟效果、持续状态和地城各自保留。此版为组合展示场面。</p></button><button data-preview="5"><span class="tag">F · NATIVE UNITY + NEW UI</span><img src="preview-f.png" alt="Unity原战场与新UI"><strong>Unity战场与新UI</strong><p>实际Unity组合场面截图保留战场、玩家、指示物、法术力、徽记与地城；叠加新横排手牌、紧凑阶段操作与可滚动长堆叠；暂不展示详情／历史。原生截图区域为静态，新增UI可交互。</p></button><div class="original"><img src="baseline-details.png" alt="同一录像场面的当前Unity界面"><section><span class="tag">当前界面 · 对照</span><strong>同一场面，先比较整体秩序</strong><p>A—D 使用同一录像场面，E 是主动组合全部区域的布局示例，F 用同一组合数据经Unity实际渲染。视频只参考横排手牌，战场的材质、空间与落场表现独立探索。</p></section></div></div><div class="native" id="native"><img src="baseline-details.png" alt="当前Unity界面"><span>当前Unity展示 · 同一录像时刻，省略过期的临时通知</span></div></main>
<footer><span id="description">悬停看牌 · 点击固定详情 · 详情／历史标签切换</span><span class="claim">交互原型，尚未替换客户端</span></footer>
<script>
const variants=[{file:'01-calm-arena.html',name:'清醒竞技场'},{file:'02-reading-table.html',name:'阅读桌面'},{file:'03-immersive-table.html',name:'沉浸牌桌'},{file:'04-tabbed-sidebar.html',name:'详情与历史'},{file:'05-full-battlefield.html',name:'完整区域'},{file:'06-native-hybrid.html',name:'Unity战场与新UI'}];const frame=document.querySelector('#preview');let current=5,mode='interact',dense=false;function updateMode(next){mode=next;frame.style.display=next==='interact'?'block':'none';document.querySelector('#comparison').style.display=next==='compare'?'grid':'none';document.querySelector('#native').style.display=next==='current'?'block':'none';document.querySelector('#interact').setAttribute('aria-pressed',next==='interact');document.querySelector('#overview').setAttribute('aria-pressed',next==='compare');document.querySelector('#current').setAttribute('aria-pressed',next==='current');document.querySelector('#dense').disabled=next!=='interact';document.querySelector('#dense').textContent=current===5?'堆叠压力':'拥挤演示';document.querySelector('#description').textContent=next==='compare'?'点击缩略图，进入对应交互预览':next==='current'?'当前正式界面 · 仅作视觉对照':current===5?'点战场收起手牌 · 点手牌展开 · 堆叠超出可视高度时滚动':'悬停看牌 · 点击固定详情 · 详情／历史标签切换';document.querySelector('footer .claim').textContent=current===5?'Unity实际截图＋新UI交互预览 · 未替换客户端':current===4?'组合展示场面 · 尚未替换客户端':'交互原型，尚未替换客户端'}function selectVariant(i){current=i;dense=false;document.querySelector('#dense').setAttribute('aria-pressed','false');document.querySelectorAll('[data-variant]').forEach(x=>x.setAttribute('aria-selected',Number(x.dataset.variant)===i));frame.src=variants[i].file;frame.title=variants[i].name+'交互预览';document.querySelector('#standalone').href=variants[i].file;updateMode('interact');document.querySelector('[data-variant="'+i+'"]').scrollIntoView({block:'nearest',inline:'nearest'})}document.querySelectorAll('[data-variant]').forEach(x=>x.onclick=()=>selectVariant(Number(x.dataset.variant)));document.querySelectorAll('[data-preview]').forEach(x=>x.onclick=()=>selectVariant(Number(x.dataset.preview)));document.querySelector('#overview').onclick=()=>updateMode('compare');document.querySelector('#interact').onclick=()=>updateMode('interact');document.querySelector('#current').onclick=()=>updateMode(mode==='current'?'interact':'current');document.querySelector('#dense').onclick=()=>{if(typeof frame.contentWindow.setDense==='function'){dense=!dense;frame.contentWindow.setDense(dense);document.querySelector('#dense').setAttribute('aria-pressed',dense)}};addEventListener('keydown',e=>{if(['1','2','3','4','5','6'].includes(e.key)&&!e.ctrlKey&&!e.altKey)selectVariant(Number(e.key)-1)});
document.querySelector('footer .claim').textContent=current===5?'Unity实际截图＋新UI交互预览 · 未替换客户端':current===4?'组合展示场面 · 尚未替换客户端':'交互原型，尚未替换客户端';const initial=new URLSearchParams(location.search).get('variant');if(initial!==null&&['0','1','2','3','4','5'].includes(initial))selectVariant(Number(initial));else updateMode('interact');
</script><script src="action-ui-data.js"></script><script src="layout-checks.js"></script></body></html>
