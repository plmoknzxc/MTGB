 p.innerHTML=`<div class="identity"><div class="portrait"><img src="${assets[seatIdentity[id].art]}" alt="头像示意"></div><div class="identity-copy"><h2 title="${name}">${name}</h2><small>手牌 ${own?7:5}</small></div><div class="life">${life}<small>生命</small></div></div><div class="zones">${[['library','牌库',own?42:39],['grave','墓地',own?8:11],['exile','放逐',own?3:2]].map(([i,n,c])=>`<button class="zone" data-zone="${n}">${icon(i)}${n}<span class="count">${c}</span></button>`).join('')}</div><div class="counters">${[[own?'energy':'poison',own?4:3,own?'能量':'中毒'],['experience',own?2:1,'经验'],['radiation',2,'辐射']].map(([i,c,n],j)=>`<button class="counter-chip ${j===2?'dense-only':''}" aria-label="${n} ${c}" data-tip="${n}指示物 · ${c}">${icon(i)}${c}</button>`).join('')}</div><div class="progress strip" data-strip="state">${nav('state',-1)}<div class="strip-viewport">${states.map(([n,k,t],i)=>`<button class="state" data-state="${i}" data-item-index="${i}" data-tip="${n} · ${t}" aria-label="${i===2?'全局':name} ${n}"><img src="${assets[k]}" alt="${n}"></button>`).join('')}</div>${nav('state',1)}</div><div class="emblems strip" data-strip="marker">${nav('marker',-1)}<div class="strip-viewport">${markers.map(([n,k,delay],i)=>`<button class="marker ${delay?'delay':''}" data-marker="${i}" data-item-index="${i}" data-tip="${n}" aria-label="${name} ${n}"><span class="art"><img src="${assets[k]}" alt="${n}"></span>${delay?`<span class="clock">${icon('clock')}</span>`:''}</button>`).join('')}</div>${nav('marker',1)}</div>`;
 p.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{const [n,k,t,text]=states[b.dataset.state];detail(n,k,text);});
 p.querySelectorAll('[data-marker]').forEach(b=>b.onclick=()=>{const [n,k,d,text]=markers[b.dataset.marker];detail(n,k,text);});
 p.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{if(!own&&b.dataset.zone==='牌库'){openDialog('<h2>对手牌库</h2><p>剩余 39 张 · 牌库内容不公开</p>');return;}openDialog(`<h2>${name} · ${b.dataset.zone}</h2><p>${b.dataset.zone==='牌库'?'数量可见，内容保持隐藏':'公开区域浏览示意'}</p><div class="cards">${(b.dataset.zone==='牌库'?['back','back','back']:['charm','warden','wildguide','bear','bolt']).map(k=>`<img src="${assets[k]}" alt="区域示意牌">`).join('')}</div>`);});
 const command=document.createElement('div');command.className='command-tools';command.innerHTML=`<button class=command-zone aria-label="${name} 统帅区">${icon('crown')}统帅区</button><button class=command-damage aria-label="${name} 指挥官伤害">${icon('crown')}伤害 6</button>`;p.querySelector('.zones').after(command);const pool=document.createElement('div');pool.className='seat-mana';pool.setAttribute('aria-label',name+' 法术力池');pool.innerHTML=poolMarkup(id);p.querySelector('.identity').after(pool);command.querySelector('.command-zone').onclick=()=>openDialog(`<h2>${name} · 统帅区</h2><p>为指挥官牌面与相关入口预留位置。此处是布局占位，未绑定实际指挥官。</p>`);command.querySelector('.command-damage').onclick=()=>openDialog(`<h2>${name} · 指挥官伤害</h2><p>来源指挥官 A：6<br>来源指挥官 B：0<br>来源指挥官 C：0</p><p class=subtle>布局演示数字；正式实现按来源指挥官记录，不能只按玩家合并。</p>`);
 renderPlayerStrips(id);
}
player('opponent',false);player('self',true);player('opponentB',false,'对手 B');player('opponentC',false,'对手 C');
const boardRows=[['enemy-lands',[['island','×4',null,true],['mountain','×2',null,false],['island',null,null,false]]],['enemy-creatures',[['bear',null,'2/2'],['warden',null,'1/1'],['bear',null,'4/4']]],['self-creatures',[['wildguide',null,'2/2'],['bear','×3','5/5'],['warden',null,'1/1'],['wildguide',null,'3/3']]],['self-lands',[['mountain','×3',null,true],['island','×2',null,false],['mountain',null,null,true]]]];
document.querySelector('#board').innerHTML=boardRows.map(([row,cards])=>`<div class="row ${row}">${cards.map(([k,q,pt,t],i)=>`<button class="permanent ${t?'tapped':''}" data-card="${k}" aria-label="查看${k}卡牌"><img src="${assets[k]}" alt="">${q?`<span class="qty">${q}</span>`:''}${pt?`<span class="pt ${pt==='5/5'?'modified':''}">${pt}</span>`:''}${pt==='4/4'?'<span class="counter">2</span>':''}</button>`).join('')}</div>`).join('');
document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>detail('卡牌检视',b.dataset.card,'原型展示牌面与状态位置。此演示不进行施放或选择目标。'));
const seats=[['opponent','对手 A'],['opponentB','对手 B'],['self','你'],['opponentC','对手 C']];
const permanentGroups={
 creatures:['bear','wildguide','warden','bear','warden','wildguide'],
 artifacts:['Sol Ring','Arcane Signet','Mind Stone','Lightning Greaves','Skullclamp'],
 enchantments:['Rhystic Study','Smothering Tithe','Doubling Season','Ghostly Prison','Sylvan Library'],
 walkers:['Jace, the Mind Sculptor','Chandra, Torch of Defiance','Liliana of the Veil','Teferi, Hero of Dominaria','Garruk Wildspeaker'],
 battles:['Invasion of Zendikar'],lands:['mountain','island','mountain']};
function quadCard(k,kind,j){const stat=kind==='creatures'?(k==='warden'?'1/1':'2/2'):kind==='walkers'?String([3,4,3,4,3][j]):kind==='battles'?'3':null;return `<button class="permanent ${kind==='battles'?'battle-permanent':''}" data-quad-card="${k}" data-kind="${kind}" title="${k}" aria-label="检视 ${k}"><img src="${assets[k]}" alt="${k}">${stat?`<span class="${kind==='creatures'?'pt':kind==='walkers'?'loyalty':'defense'}">${stat}</span>`:''}${kind==='lands'&&j===0?'<span class="qty">×3</span>':''}</button>`;}
function fan(kind,label,keys){return `<div class="battle-group" data-group="${kind}"><span class="group-name">${label} ${keys.length}${kind==='lands'?'组':''}</span><div class="permanent-fan">${keys.map((k,j)=>`<span class="fan-item">${quadCard(k,kind,j)}</span>`).join('')}</div></div>`;}
function renderQuarters(){document.querySelectorAll('.quarter-cards').forEach((root,i)=>{const creatures=permanentGroups.creatures.slice(0,stage.classList.contains('dense')?6:3);root.innerHTML=`<div class="battle-row creature-row">${fan('creatures','生物',creatures)}</div>${fullBoard?`<div class="battle-row utility-row">${fan('artifacts','神器',permanentGroups.artifacts)}${fan('enchantments','结界',permanentGroups.enchantments)}</div><div class="battle-row walker-row">${fan('walkers','旅法',permanentGroups.walkers)}${fan('battles','战役',permanentGroups.battles)}</div>`:''}<div class="battle-row land-row">${fan('lands','地',permanentGroups.lands)}</div>`;root.querySelectorAll('[data-quad-card]').forEach(b=>b.onclick=()=>detail(b.dataset.quadCard,b.dataset.quadCard,'公开牌面检视。数量、忠诚与防御是布局夹具，不代表结算测试。'));});}
document.querySelector('#quadGrid').innerHTML=seats.map(([id,name],i)=>`<section class="quadrant ${i===2?'active-seat':''}" style="--seat-color:${seatIdentity[id].color}" data-seat="${id}" aria-label="${name}的战场"><button class="quad-inspect" aria-label="放大${name}战场">${icon('eye')}</button><div class="quarter-cards"></div></section>`).join('');
renderQuarters();
document.querySelectorAll('.quad-inspect').forEach(b=>b.onclick=()=>{const q=b.closest('.quadrant'),grid=document.querySelector('#quadGrid'),expanded=q.classList.contains('focus-seat');grid.classList.toggle('focused',!expanded);grid.querySelectorAll('.quadrant').forEach(el=>el.classList.toggle('focus-seat',el===q&&!expanded));b.setAttribute('aria-label',expanded?'放大'+seatIdentity[q.dataset.seat].name+'战场':'返回四人战场');b.innerHTML=icon(expanded?'eye':'close');});
function setLayout(layout){stage.classList.remove('layout-'+currentLayout);currentLayout=layout;stage.classList.add('layout-'+layout);for(const [id] of seats){const p=document.getElementById(id);(layout==='d'?document.querySelector(`[data-seat="${id}"]`):stage).appendChild(p);p.querySelector('.identity h2').textContent=layout==='d'?seatIdentity[id].name:id==='self'?'永動回転人形':id==='opponent'?'对手':seatIdentity[id].name;p.querySelector('.life').innerHTML=`${layout==='d'?40:id==='self'?24:18}<small>生命</small>`;}document.querySelector('#turnOwner').textContent=`第 8 回合 · ${phaseIndex===3?(layout==='d'?'对手 A 的回合':'对手的回合'):'你的回合'}`;document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===layout)));document.querySelector('#layoutNote').innerHTML=notes[layout];renderStack();}
function hand(id,keys){document.getElementById(id).innerHTML=keys.map((k,i)=>{const x=i-(keys.length-1)/2;return `<button style="--r:${x*3.4}deg;--y:${x*x*3.2}px" aria-label="${id==='enemyHand'?'对手隐藏手牌':'检视手牌 '+(i+1)}"><img src="${assets[k]}" alt="${id==='enemyHand'?'牌背':'手牌'}"></button>`}).join('');}
hand('enemyHand',Array(5).fill('back'));hand('selfHand',['mountain','bear','wildguide','charm','counterspell','bolt','island']);
document.querySelectorAll('#selfHand button').forEach((b,i)=>b.onclick=()=>detail('手牌检视',['mountain','bear','wildguide','charm','counterspell','bolt','island'][i],'只演示悬停展开与详细检视。'));
document.querySelector('#mana').innerHTML=[['U',2],['R',1],['C',1]].map(([k,n])=>`<button aria-label="使用${k}法术力" data-tip="可点击池中已有法术力，手动付款"><span>${n}</span><img src="${assets[k]}" alt="${k}法术力"></button>`).join('');
const stackEntries=[{key:'bolt',controller:'opponentB'},{key:'counterspell',controller:'opponentC'},{key:'negate',controller:'opponent'},{key:'bolt',controller:'self'},{key:'counterspell',controller:'opponentB'},{key:'wildguide',controller:'opponentC'},{key:'charm',controller:'self'}];
function stackOwner(entry){const id=currentLayout==='d'?entry.controller:entry.controller==='self'?'self':'opponent';return {id,...seatIdentity[id],name:id==='opponent'&&currentLayout!=='d'?'对手':seatIdentity[id].name};}
function ownerBadge(entry){const o=stackOwner(entry);return `<span class="stack-owner" style="--seat-color:${o.color}"><img src="${assets[o.art]}" alt=""><i></i>${o.name}</span>`;}
function sourceHighlight(id,on){document.getElementById(id).classList.toggle('stack-source',on);document.querySelector(`[data-seat="${id}"]`).classList.toggle('stack-source',on);}
function renderStack(){const entries=manyStack?stackEntries:[stackEntries[6]];document.querySelector('#stackCount').textContent=entries.length;document.querySelector('#stackView').classList.toggle('hidden',!manyStack);document.querySelector('#stack').innerHTML=entries.map((e,i)=>{const n=entries.length-1-i,o=stackOwner(e);return `<button class="stack-card" style="--seat-color:${o.color};transform:translate(${-n*9}px,${n*8}px) rotate(${-n*2.4}deg)" aria-label="堆叠第${i+1}项 · ${o.name}" title="操控者：${o.name}"><img src="${assets[e.key]}" alt="堆叠牌面">${ownerBadge(e)}${i===entries.length-1?'<span class="selected-mode">目标牌手或鹏洛客受到 4 点伤害。</span>':''}${e.key==='wildguide'?'<span class="ribbon">繁生 · 已支付</span>':''}</button>`;}).join('');document.querySelectorAll('.stack-card').forEach((b,i)=>{const o=stackOwner(entries[i]);b.onmouseenter=()=>sourceHighlight(o.id,true);b.onmouseleave=()=>sourceHighlight(o.id,false);b.onclick=()=>detail('堆叠 · '+o.name,entries[i].key,'操控者：'+o.name+'。来源玩家通过名称、头像与相同色标对应；这份原型只读展示。');});}
renderStack();
document.querySelector('#stackCollapse').onclick=()=>{const collapsed=document.querySelector('#stack').classList.toggle('collapsed');const b=document.querySelector('#stackCollapse');b.innerHTML=icon(collapsed?'left':'right');b.setAttribute('aria-expanded',String(!collapsed));b.setAttribute('aria-label',collapsed?'展开堆叠':'收起堆叠');};
document.querySelector('#stackView').onclick=()=>{openDialog(`<h2>堆叠</h2><p>按顺序横向查看 · 标明操控者 · 只读浏览</p><div class="stack-list-tools"><button class="circle" id="stackListPrev" aria-label="向左查看堆叠" disabled>${icon('left')}</button><button class="circle" id="stackListNext" aria-label="向右查看堆叠">${icon('right')}</button></div><div class="cards" id="stackListCards">${stackEntries.map((e,i)=>`<div class="stack-list-entry">${ownerBadge(e)}<img src="${assets[e.key]}" alt="堆叠第${i+1}项"><p class="subtle">${i===6?'顶部 · 先结算':'第 '+(i+1)+' 项'} · ${stackOwner(e).name}</p></div>`).join('')}</div>`);const list=dialog.querySelector('#stackListCards'),prev=dialog.querySelector('#stackListPrev'),next=dialog.querySelector('#stackListNext');const refresh=()=>{prev.disabled=list.scrollLeft<1;next.disabled=list.scrollLeft>=list.scrollWidth-list.clientWidth-1;};prev.onclick=()=>list.scrollBy({left:-420,behavior:'smooth'});next.onclick=()=>list.scrollBy({left:420,behavior:'smooth'});list.addEventListener('scroll',refresh);refresh();};
const events=[['charm','你','施放了波洛斯护符','选择：对目标牌手或鹏洛客造成 4 点伤害'],['wildguide','你','施放了生物咒语','已支付繁生费用'],['bolt','对手','施放了闪电击','目标：你的生物'],['counterspell','你','施放了反击咒语','目标：闪电击'],['warden','你','获得了 1 点生命','来自公开触发异能']];
document.querySelector('#history').innerHTML=`<h3>历史记录 <small>只读</small></h3><div class="turn">第 8 回合 · 你<span>主阶段</span></div>${events.map(([k,p,t,d],i)=>`<button class="event" data-event="${i}"><img src="${assets[k]}" alt=""><span><b>${p}</b> ${t}<small>${d}</small></span></button>`).join('')}<div class="turn">第 7 回合 · 对手<span>结束阶段</span></div><div class="event"><span>对手的回合结束<small>公开行动按时间排列；隐藏手牌不写入记录</small></span></div>`;
document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{const [k,p,t,d]=events[b.dataset.event];detail(t,k,d);});
document.querySelector('#logToggle').onclick=()=>{const v=stage.classList.toggle('log-open');document.querySelector('#logToggle').setAttribute('aria-expanded',String(v));document.querySelector('#logToggle').classList.toggle('active',v);};
function openDialog(content){document.querySelector('#auto').disabled=true;document.querySelector('#priority').disabled=true;choiceOpen=true;viewing=false;dialog.innerHTML=content+`<button class="circle close" aria-label="关闭窗口">${icon('close')}</button>`;overlay.classList.remove('hidden');document.querySelector('#viewBattlefield').classList.remove('hidden');document.querySelector('#viewBattlefield').textContent='查看战场';dialog.querySelector('.close').onclick=closeDialog;}
function closeDialog(){document.querySelector('#auto').disabled=false;document.querySelector('#priority').disabled=phaseIndex===3;choiceOpen=false;viewing=false;overlay.classList.add('hidden');document.querySelector('#viewBattlefield').classList.add('hidden');document.querySelector('#choiceFixture').setAttribute('aria-pressed','false');}
overlay.onclick=e=>{if(e.target===overlay)closeDialog();};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();});
document.querySelector('#viewBattlefield').onclick=()=>{viewing=!viewing;overlay.classList.toggle('hidden',viewing);document.querySelector('#viewBattlefield').textContent=viewing?'返回选择':'查看战场';};
document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>setLayout(b.dataset.layout));
document.querySelector('#density').onclick=()=>{const v=stage.classList.toggle('dense');document.querySelector('#density').setAttribute('aria-pressed',String(v));seats.forEach(([id])=>renderPlayerStrips(id));renderQuarters();};
document.querySelector('#fullBoardFixture').onclick=()=>{fullBoard=!fullBoard;stage.classList.toggle('full-board',fullBoard);document.querySelector('#fullBoardFixture').setAttribute('aria-pressed',String(fullBoard));if(fullBoard){stage.classList.add('dense');document.querySelector('#density').setAttribute('aria-pressed','true');seats.forEach(([id])=>renderPlayerStrips(id));setLayout('d');}renderQuarters();};
document.querySelector('#stackFixture').onclick=()=>{manyStack=!manyStack;document.querySelector('#stackFixture').setAttribute('aria-pressed',String(manyStack));renderStack();};
document.querySelector('#choiceFixture').onclick=()=>{if(choiceOpen){closeDialog();return;}openDialog(`<h2>选择效果</h2><p>窗口保持输入与滚动位置；设置旁可切换查看战场</p><div class="cards">${['charm','wildguide','bolt'].map(k=>`<img src="${assets[k]}" alt="选择牌面示意">`).join('')}</div><button class="minor" id="demoCancel">取消</button>`);document.querySelector('#demoCancel').onclick=closeDialog;document.querySelector('#choiceFixture').setAttribute('aria-pressed','true');};
document.querySelector('#auto').onclick=()=>{const b=document.querySelector('#auto'),v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(v));document.querySelector('#autoState').textContent=v?'ON':'OFF';};
let phaseIndex=0;const phases=[['战斗前主阶段','下一步','进入战斗'],['战斗阶段','下一步','战斗后主阶段'],['战斗后主阶段','结束回合','交给对手'],['战斗前主阶段','等待对手','暂无优先权']];
document.querySelector('#priority').onclick=()=>{phaseIndex=(phaseIndex+1)%4;const [p,t,h]=phases[phaseIndex];document.querySelector('#phase').textContent=p;document.querySelector('#priority').innerHTML=`<span>${t}</span>${icon('right')}`;document.querySelector('#priority').title=h;document.querySelector('#turnOwner').textContent=`第 8 回合 · ${phaseIndex===3?(currentLayout==='d'?'对手 A 的回合':'对手的回合'):'你的回合'}`;document.querySelectorAll('.quadrant').forEach(el=>el.classList.toggle('active-seat',el.dataset.seat===(phaseIndex===3?'opponent':'self')));document.querySelector('#priority').disabled=phaseIndex===3;document.querySelectorAll('#phaseTrack i').forEach((el,i)=>{el.className=i<phaseIndex+1?'past':i===phaseIndex+1?'now':'';});};
document.querySelector('#priority').title='进入战斗';
document.querySelector('#settings').onclick=()=>openDialog('<h2>对局设置</h2><p>此处保留当前设置入口；原型只比较布局与交互位置。</p>');
document.querySelector('#leave').onclick=()=>openDialog('<h2>离开战场</h2><p>设计原型不会退出实际对局。</p>');
const tooltip=document.querySelector('#tooltip');document.querySelectorAll('[data-tip]').forEach(b=>{b.onmouseenter=()=>{tooltip.textContent=b.dataset.tip;tooltip.classList.remove('hidden');const s=stage.getBoundingClientRect(),r=b.getBoundingClientRect(),scale=s.width/1920;tooltip.style.left=(r.left-s.left)/scale+'px';tooltip.style.top=((r.top-s.top)/scale-55)+'px';};b.onmouseleave=()=>tooltip.classList.add('hidden');});
hydrate();
</script></body></html>
