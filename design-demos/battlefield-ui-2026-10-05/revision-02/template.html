.stage.layout-c .strip{left:338px;width:350px}.stage.layout-c .emblems{top:99px}.stage.layout-c .player,.stage.layout-c.dense .player{height:240px}
</style></head><body>
<header class="workbench"><span class="brand">MTGB</span><span class="draft">战场设计原型 · 02</span><nav class="variants" aria-label="布局方案"><button data-layout="a" aria-pressed="true">A · 左侧玩家区</button><button data-layout="b" aria-pressed="false">B · 对角头像</button><button data-layout="c" aria-pressed="false">C · 内缘状态台</button></nav><div class="fixtures"><button id="density" aria-pressed="false">大量状态</button><button id="stackFixture" aria-pressed="true">七层堆叠</button><button id="choiceFixture" aria-pressed="false">选择窗口</button></div></header>
<div class="viewport"><main class="stage layout-a" id="stage" aria-label="战场设计演示"><div class="backdrop" id="background"></div><div class="middle"></div>
<div class="utilities"><button class="circle" data-icon="settings" aria-label="设置" id="settings"></button><button class="utility-label hidden" id="viewBattlefield">查看战场</button><button class="utility-label" id="leave">离开战场</button></div>
<div class="phasebar"><span>第 8 回合</span><b>你的回合</b><button class="day" id="dayButton">☼ 白昼</button></div>
<div class="hand enemy" id="enemyHand" aria-label="对手手牌"></div><div class="board" id="board"></div><div class="hand self" id="selfHand" aria-label="自己的手牌"></div>
<section class="player opponent" id="opponent" aria-label="对手与状态"></section><section class="player self" id="self" aria-label="自己与状态"></section><div class="mana" id="mana" aria-label="法术力池"></div>
<div class="right-tools"><button class="circle" id="logToggle" data-icon="history" aria-label="历史记录" aria-expanded="false"></button></div>
<div class="stack-controls"><span class="stack-count" id="stackCount">7</span><button class="circle" id="stackView" data-icon="eye" aria-label="查看所有堆叠"></button><button class="circle" id="stackCollapse" data-icon="right" aria-label="收起堆叠" aria-expanded="true"></button></div><section class="stack" id="stack" aria-label="堆叠"></section>
<aside class="history" id="history" aria-label="对局历史"></aside>
<div class="action-dock"><div class="turn-info"><span>第 8 回合</span><span class="phase" id="phase">战斗前主阶段</span></div><div class="phase-track" id="phaseTrack"><i class="past"></i><i class="now"></i><i></i><i></i><i></i></div><button class="priority" id="priority"><span>下一步<small>进入战斗</small></span><span data-icon="right"></span></button><button class="auto" id="auto" aria-pressed="false"><span class="switch"></span>AUTO <span id="autoState">OFF</span></button></div>
<div class="overlay hidden" id="overlay"><section class="dialog" id="dialog"></section></div><div class="tooltip hidden" id="tooltip"></div></main></div>
<footer class="footer"><span id="layoutNote"><b>A · 推荐方向</b>　历史放左侧，右侧保留堆叠；状态与徽记单行图标，超出用箭头翻页。</span><span>演示数据 · 可点状态 / 区域 / 历史 / 堆叠 / AUTO</span></footer>
<script>
const assets=__ASSETS__;
const paths={settings:'<circle cx="12" cy="12" r="4"/><path d="M10 2h4l1 3 3 2 3 .5 1 4-2 2-1 3 .5 3-4 2-2-2-3-1-3 .5-2-4 2-2 1-3-.5-3 4-2z"/>',history:'<path d="M4 7a9 9 0 1 1-1 8M4 2v5h5"/><path d="M12 7v6l4 2"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',right:'<path d="M5 12h14M13 5l7 7-7 7"/>',left:'<path d="M19 12H5M11 5l-7 7 7 7"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',library:'<path d="m3 8 9-5 9 5-9 5zM3 12l9 5 9-5M3 16l9 5 9-5"/>',grave:'<path d="M5 21V10a7 7 0 0 1 14 0v11M3 21h18M12 8v8M9 11h6"/>',exile:'<circle cx="12" cy="12" r="8"/><path d="m3 21 18-18"/>',poison:'<path d="M7 5h10l3 4v7l-4 4H8l-4-4V9zM9 10v2M15 10v2M9 16h6M12 14v3"/>',energy:'<path d="m13 2-8 12h7l-1 8 8-12h-7z"/>',experience:'<path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/>',crown:'<path d="M3 6 7 12l5-9 5 9 4-6-2 13H5z"/>',radiation:'<circle cx="12" cy="12" r="2"/><path d="m9 8-3-5-4 7h6M15 8l3-5 4 7h-6M9 16l-3 5h12l-3-5"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.experience}</svg>`;
const stage=document.querySelector('#stage'), overlay=document.querySelector('#overlay'),dialog=document.querySelector('#dialog');
let manyStack=true,viewing=false,choiceOpen=false,currentLayout='a';
document.querySelector('.utilities').insertBefore(document.querySelector('#logToggle'),document.querySelector('#viewBattlefield'));
document.querySelector('#background').style.backgroundImage=`url(${assets.background})`;
const notes={a:'<b>A · 推荐方向</b>　历史放左侧，右侧保留堆叠；状态与徽记单行图标，超出用箭头翻页。',b:'<b>B · 对角头像</b>　更接近 MD；对手状态与右侧堆叠争空间，大量状态时最拥挤。',c:'<b>C · 内缘状态台</b>　头像向场内靠一点，状态横向展开；更醒目，但会占用地牌与手牌边缘。'};
function scale(){const box=document.querySelector('.viewport'),s=Math.min(box.clientWidth/1920,box.clientHeight/1080);stage.style.transform=`scale(${s})`;stage.style.position='absolute';stage.style.left=`${(box.clientWidth-1920*s)/2}px`;stage.style.top=`${(box.clientHeight-1080*s)/2}px`;}
window.addEventListener('resize',scale);scale();
function hydrate(root=document){root.querySelectorAll('[data-icon]').forEach(x=>x.innerHTML=icon(x.dataset.icon));}
function detail(title,key,text){openDialog(`<h2>${title}</h2><div class="detail"><img src="${assets[key]}" alt="${title}"><div><b>${title}</b><p>${text}</p><p class="subtle">点击外侧或按 Esc 返回战场</p></div></div>`);}
const states=[['魔戒','ring','3 / 4','引诱进度 3 / 4。点开显示完整魔戒辅助牌；实际等级由引擎提供。'],['地城','dungeon','当前房间','凡戴尔失落矿坑。缩略状态显示当前房间，点开完整路径。'],['登殿','blessing','城市祝福','城市祝福作为已获得的玩家状态保留可见。'],['君主','monarch','已获得','君主状态独立显示。此处仅演示拥挤布局。'],['速度','speed','3 / 4','速度状态显示当前进度，不放入法术力池。']];
const markers=[['加鲁克徽记','garruk',false,'你操控的生物得 +3/+3 且具有践踏异能。'],['下次维持','charm',true,'延迟效果的布局占位；展示公开来源与到期时点。'],['回合结束','bolt',true,'延迟效果的布局占位；与徽记使用不同轮廓。'],['第二个徽记','garruk',false,'第二个独立徽记保留独立位置，不能按牌名合并。'],['下回合','wildguide',true,'另一条独立延迟记录。'],['持续效果','warden',false,'来源公开时显示来源插画，来源隐藏时必须改为匿名图标。']];
const playerStripPages = {};
function renderPlayerStrips(id){
 const p=document.getElementById(id),own=id==='self',dense=stage.classList.contains('dense');
 for(const kind of ['state','marker']){
  const row=p.querySelector(`[data-strip="${kind}"]`),items=[...row.querySelectorAll('[data-item-index]')];
  const active=items.filter(b=>dense||(kind==='state'?Number(b.dataset.itemIndex)<3&&(own||b.dataset.itemIndex!=='1'):Number(b.dataset.itemIndex)<(own?3:2)));
  const key=id+'-'+kind,pages=Math.ceil(active.length/3),page=Math.min(playerStripPages[key]||0,pages-1);
  playerStripPages[key]=page;items.forEach(b=>b.classList.add('hidden'));active.slice(page*3,page*3+3).forEach(b=>b.classList.remove('hidden'));
  row.dataset.page=page+1;row.dataset.pages=pages;
  row.querySelectorAll('.strip-nav').forEach(b=>{b.classList.toggle('hidden',pages<=1);const dir=Number(b.dataset.direction);b.disabled=dir<0?page===0:page===pages-1;b.onclick=()=>{playerStripPages[key]=page+dir;renderPlayerStrips(id);};});
 }
}
function player(id,own){const p=document.getElementById(id),name=own?'永動回転人形':'对手',life=own?24:18;
 const nav=(kind,dir)=>`<button class="strip-nav" data-direction="${dir}" aria-label="${name} ${dir<0?'上一页':'下一页'}${kind==='state'?'状态':'徽记和延迟效果'}">${icon(dir<0?'left':'right')}</button>`;
 p.innerHTML=`<div class="identity"><div class="portrait"><img src="${assets[own?'warden':'garruk']}" alt="头像示意"></div><div class="identity-copy"><h2 title="${name}">${name}</h2><small>手牌 ${own?7:5}</small></div><div class="life">${life}<small>生命</small></div></div><div class="zones">${[['library','牌库',own?42:39],['grave','墓地',own?8:11],['exile','放逐',own?3:2]].map(([i,n,c])=>`<button class="zone" data-zone="${n}">${icon(i)}${n}<span class="count">${c}</span></button>`).join('')}</div><div class="counters">${[[own?'energy':'poison',own?4:3,own?'能量':'中毒'],['experience',own?2:1,'经验'],['radiation',2,'辐射']].map(([i,c,n],j)=>`<button class="counter-chip ${j===2?'dense-only':''}" aria-label="${n} ${c}" data-tip="${n}指示物 · ${c}">${icon(i)}${c}</button>`).join('')}</div><div class="progress strip" data-strip="state">${nav('state',-1)}<div class="strip-viewport">${states.map(([n,k,t],i)=>`<button class="state" data-state="${i}" data-item-index="${i}" data-tip="${n} · ${t}" aria-label="${name} ${n}"><img src="${assets[k]}" alt="${n}"></button>`).join('')}</div>${nav('state',1)}</div><div class="emblems strip" data-strip="marker">${nav('marker',-1)}<div class="strip-viewport">${markers.map(([n,k,delay],i)=>`<button class="marker ${delay?'delay':''}" data-marker="${i}" data-item-index="${i}" data-tip="${n}" aria-label="${name} ${n}"><span class="art"><img src="${assets[k]}" alt="${n}"></span>${delay?`<span class="clock">${icon('clock')}</span>`:''}</button>`).join('')}</div>${nav('marker',1)}</div>`;
 p.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{const [n,k,t,text]=states[b.dataset.state];detail(n,k,text);});
 p.querySelectorAll('[data-marker]').forEach(b=>b.onclick=()=>{const [n,k,d,text]=markers[b.dataset.marker];detail(n,k,text);});
 p.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{if(!own&&b.dataset.zone==='牌库'){openDialog('<h2>对手牌库</h2><p>剩余 39 张 · 牌库内容不公开</p>');return;}openDialog(`<h2>${name} · ${b.dataset.zone}</h2><p>${b.dataset.zone==='牌库'?'数量可见，内容保持隐藏':'公开区域浏览示意'}</p><div class="cards">${(b.dataset.zone==='牌库'?['back','back','back']:['charm','warden','wildguide','bear','bolt']).map(k=>`<img src="${assets[k]}" alt="区域示意牌">`).join('')}</div>`);});
 renderPlayerStrips(id);
}
player('opponent',false);player('self',true);
const boardRows=[['enemy-lands',[['island','×4',null,true],['mountain','×2',null,false],['island',null,null,false]]],['enemy-creatures',[['bear',null,'2/2'],['warden',null,'1/1'],['bear',null,'4/4']]],['self-creatures',[['wildguide',null,'2/2'],['bear','×3','5/5'],['warden',null,'1/1'],['wildguide',null,'3/3']]],['self-lands',[['mountain','×3',null,true],['island','×2',null,false],['mountain',null,null,true]]]];
document.querySelector('#board').innerHTML=boardRows.map(([row,cards])=>`<div class="row ${row}">${cards.map(([k,q,pt,t],i)=>`<button class="permanent ${t?'tapped':''}" data-card="${k}" aria-label="查看${k}卡牌"><img src="${assets[k]}" alt="">${q?`<span class="qty">${q}</span>`:''}${pt?`<span class="pt ${pt==='5/5'?'modified':''}">${pt}</span>`:''}${pt==='4/4'?'<span class="counter">2</span>':''}</button>`).join('')}</div>`).join('');
document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>detail('卡牌检视',b.dataset.card,'原型展示牌面与状态位置。此演示不进行施放或选择目标。'));
function hand(id,keys){document.getElementById(id).innerHTML=keys.map((k,i)=>{const x=i-(keys.length-1)/2;return `<button style="--r:${x*3.4}deg;--y:${x*x*3.2}px" aria-label="${id==='enemyHand'?'对手隐藏手牌':'检视手牌 '+(i+1)}"><img src="${assets[k]}" alt="${id==='enemyHand'?'牌背':'手牌'}"></button>`}).join('');}
hand('enemyHand',Array(5).fill('back'));hand('selfHand',['mountain','bear','wildguide','charm','counterspell','bolt','island']);
document.querySelectorAll('#selfHand button').forEach((b,i)=>b.onclick=()=>detail('手牌检视',['mountain','bear','wildguide','charm','counterspell','bolt','island'][i],'只演示悬停展开与详细检视。'));
document.querySelector('#mana').innerHTML=[['U',2],['R',1],['C',1]].map(([k,n])=>`<button aria-label="使用${k}法术力" data-tip="可点击池中已有法术力，手动付款"><span>${n}</span><img src="${assets[k]}" alt="${k}法术力"></button>`).join('');
const stackKeys=['bolt','counterspell','negate','bolt','counterspell','wildguide','charm'];
function renderStack(){const keys=manyStack?stackKeys:['charm'];document.querySelector('#stackCount').textContent=keys.length;document.querySelector('#stackView').classList.toggle('hidden',!manyStack);document.querySelector('#stack').innerHTML=keys.map((k,i)=>{const n=keys.length-1-i;return `<button class="stack-card" style="transform:translate(${-n*9}px,${n*8}px) rotate(${-n*2.4}deg)" aria-label="堆叠第${i+1}项"><img src="${assets[k]}" alt="堆叠牌面">${i===keys.length-1?'<span class="selected-mode">目标牌手或鹏洛客受到 4 点伤害。</span>':''}${k==='wildguide'?'<span class="ribbon">繁生 · 已支付</span>':''}</button>`}).join('');document.querySelectorAll('.stack-card').forEach((b,i)=>b.onclick=()=>detail('堆叠牌面',keys[i],i===keys.length-1?'已选模式直接展示在卡牌正文区域。':'只读检视；真实目标选择由独立原生请求进入。'));}
renderStack();
document.querySelector('#stackCollapse').onclick=()=>{const collapsed=document.querySelector('#stack').classList.toggle('collapsed');const b=document.querySelector('#stackCollapse');b.innerHTML=icon(collapsed?'left':'right');b.setAttribute('aria-expanded',String(!collapsed));b.setAttribute('aria-label',collapsed?'展开堆叠':'收起堆叠');};
document.querySelector('#stackView').onclick=()=>openDialog(`<h2>堆叠</h2><p>按顺序横向查看 · 只读浏览</p><div class="cards">${stackKeys.map((k,i)=>`<div><img src="${assets[k]}" alt="堆叠第${i+1}项"><p class="subtle">${i===6?'顶部 · 先结算':'第 '+(i+1)+' 项'}</p></div>`).join('')}</div>`);
const events=[['charm','你','施放了波洛斯护符','选择：对目标牌手或鹏洛客造成 4 点伤害'],['wildguide','你','施放了生物咒语','已支付繁生费用'],['bolt','对手','施放了闪电击','目标：你的生物'],['counterspell','你','施放了反击咒语','目标：闪电击'],['warden','你','获得了 1 点生命','来自公开触发异能']];
document.querySelector('#history').innerHTML=`<h3>历史记录 <small>只读</small></h3><div class="turn">第 8 回合 · 你<span>主阶段</span></div>${events.map(([k,p,t,d],i)=>`<button class="event" data-event="${i}"><img src="${assets[k]}" alt=""><span><b>${p}</b> ${t}<small>${d}</small></span></button>`).join('')}<div class="turn">第 7 回合 · 对手<span>结束阶段</span></div><div class="event"><span>对手的回合结束<small>公开行动按时间排列；隐藏手牌不写入记录</small></span></div>`;
document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{const [k,p,t,d]=events[b.dataset.event];detail(t,k,d);});
document.querySelector('#logToggle').onclick=()=>{const v=stage.classList.toggle('log-open');document.querySelector('#logToggle').setAttribute('aria-expanded',String(v));document.querySelector('#logToggle').classList.toggle('active',v);};
function openDialog(content){document.querySelector('#auto').disabled=true;document.querySelector('#priority').disabled=true;choiceOpen=true;viewing=false;dialog.innerHTML=content+`<button class="circle close" aria-label="关闭窗口">${icon('close')}</button>`;overlay.classList.remove('hidden');document.querySelector('#viewBattlefield').classList.remove('hidden');document.querySelector('#viewBattlefield').textContent='查看战场';dialog.querySelector('.close').onclick=closeDialog;}
function closeDialog(){document.querySelector('#auto').disabled=false;document.querySelector('#priority').disabled=phaseIndex===3;choiceOpen=false;viewing=false;overlay.classList.add('hidden');document.querySelector('#viewBattlefield').classList.add('hidden');document.querySelector('#choiceFixture').setAttribute('aria-pressed','false');}
overlay.onclick=e=>{if(e.target===overlay)closeDialog();};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();});
document.querySelector('#viewBattlefield').onclick=()=>{viewing=!viewing;overlay.classList.toggle('hidden',viewing);document.querySelector('#viewBattlefield').textContent=viewing?'返回选择':'查看战场';};
document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{stage.classList.remove('layout-'+currentLayout);currentLayout=b.dataset.layout;stage.classList.add('layout-'+currentLayout);document.querySelectorAll('[data-layout]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#layoutNote').innerHTML=notes[currentLayout];});
document.querySelector('#density').onclick=()=>{const v=stage.classList.toggle('dense');document.querySelector('#density').setAttribute('aria-pressed',String(v));renderPlayerStrips('opponent');renderPlayerStrips('self');};
document.querySelector('#stackFixture').onclick=()=>{manyStack=!manyStack;document.querySelector('#stackFixture').setAttribute('aria-pressed',String(manyStack));renderStack();};
document.querySelector('#choiceFixture').onclick=()=>{if(choiceOpen){closeDialog();return;}openDialog(`<h2>选择效果</h2><p>窗口保持输入与滚动位置；设置旁可切换查看战场</p><div class="cards">${['charm','wildguide','bolt'].map(k=>`<img src="${assets[k]}" alt="选择牌面示意">`).join('')}</div><button class="minor" id="demoCancel">取消</button>`);document.querySelector('#demoCancel').onclick=closeDialog;document.querySelector('#choiceFixture').setAttribute('aria-pressed','true');};
document.querySelector('#auto').onclick=()=>{const b=document.querySelector('#auto'),v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(v));document.querySelector('#autoState').textContent=v?'ON':'OFF';};
let phaseIndex=0;const phases=[['战斗前主阶段','下一步','进入战斗'],['战斗阶段','下一步','战斗后主阶段'],['战斗后主阶段','结束回合','交给对手'],['对手的回合','等待对手','暂无优先权']];
document.querySelector('#priority').onclick=()=>{phaseIndex=(phaseIndex+1)%4;const [p,t,h]=phases[phaseIndex];document.querySelector('#phase').textContent=p;document.querySelector('#priority').innerHTML=`<span>${t}<small>${h}</small></span>${icon('right')}`;document.querySelector('#priority').disabled=phaseIndex===3;document.querySelectorAll('#phaseTrack i').forEach((el,i)=>{el.className=i<phaseIndex+1?'past':i===phaseIndex+1?'now':'';});};
document.querySelector('#dayButton').onclick=()=>detail('白昼','day','昼夜属于全局状态，仅显示一次。点击辅助图查看规则，正式实现读取引擎状态。');
document.querySelector('#settings').onclick=()=>openDialog('<h2>对局设置</h2><p>此处保留当前设置入口；原型只比较布局与交互位置。</p>');
document.querySelector('#leave').onclick=()=>openDialog('<h2>离开战场</h2><p>设计原型不会退出实际对局。</p>');
const tooltip=document.querySelector('#tooltip');document.querySelectorAll('[data-tip]').forEach(b=>{b.onmouseenter=()=>{tooltip.textContent=b.dataset.tip;tooltip.classList.remove('hidden');const s=stage.getBoundingClientRect(),r=b.getBoundingClientRect(),scale=s.width/1920;tooltip.style.left=(r.left-s.left)/scale+'px';tooltip.style.top=((r.top-s.top)/scale-55)+'px';};b.onmouseleave=()=>tooltip.classList.add('hidden');});
hydrate();
</script></body></html>
